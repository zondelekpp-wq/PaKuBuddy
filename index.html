<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PaKuBuddy</title>
<meta name="theme-color" content="#E35D96">
<meta name="description" content="Build a buddy from the inside out: anatomy, jobs, care, stories, music and a time machine. Free, offline, read aloud.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--pink:#FF8FB8;--pink2:#FFD6E7;--lilac:#B9A2F2;--lilac2:#EEE6FF;--mint:#9EE6C8;--ink:#4A3B66;--cream:#FFF9F3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%}
body{font-family:'Fredoka','Arial Rounded MT Bold','Nunito',system-ui,sans-serif;color:var(--ink);
 background:#FFF0F7;background-image:radial-gradient(#FFD6E7 2px,transparent 2.5px),radial-gradient(#E9DFFF 2px,transparent 2.5px);
 background-size:44px 44px;background-position:0 0,22px 22px;overflow:hidden}
button{font-family:inherit;color:inherit;border:none;cursor:pointer}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:14px 18px 18px}
.screen.on{display:flex}
.top{display:flex;align-items:center;gap:10px;min-height:52px}
.logo{font-weight:600;font-size:26px;color:#E35D96;letter-spacing:.5px}
.logo span{color:#8B6AE0}
.sp{flex:1}
.mini{width:48px;height:48px;border-radius:16px;background:#fff;font-size:22px;box-shadow:0 4px 0 #EBD9F3}
.mini.off{opacity:.45}
.bubble{background:#fff;border-radius:26px;padding:14px 18px;font-size:21px;line-height:1.45;box-shadow:0 6px 0 #F3D5E6;position:relative;min-height:72px}
.bubble .now{background:#FFF1A8;border-radius:8px;box-shadow:0 0 0 3px #FFF1A8}
.bubble .who{font-size:14px;color:#B08BD8;font-weight:500;display:block;margin-bottom:2px}
/* start */
#start{align-items:center;justify-content:center;text-align:center;gap:24px}
#start h1{font-size:54px;margin:0;color:#E35D96;font-weight:600}
#start h1 span{color:#8B6AE0}
.bigbtn{font-size:30px;font-weight:600;padding:22px 46px;border-radius:40px;background:var(--pink);color:#fff;box-shadow:0 8px 0 #E0679A;transition:transform .1s}
.bigbtn:active{transform:translateY(5px);box-shadow:0 3px 0 #E0679A}
.bigbtn.lil{background:var(--lilac);box-shadow:0 8px 0 #8E76D6}
.float{font-size:64px;animation:bob 2.4s ease-in-out infinite}
/* choose */
.cards{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:14px;align-items:center;padding:10px 0}
.card{background:#fff;border-radius:30px;padding:10px 6px 14px;box-shadow:0 8px 0 #F0D3E4;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .15s;height:100%;max-height:380px;justify-content:center}
.card svg{width:100%;height:auto;max-height:240px}
.card b{font-size:24px;font-weight:600}
.card small{font-size:16px;color:#A48BC9}
.card.sel{background:#FFF3FA;box-shadow:0 0 0 5px var(--pink),0 8px 0 #F0D3E4;transform:translateY(-6px) rotate(-1deg)}
.bottom{display:flex;gap:14px;align-items:center;justify-content:center;padding-top:6px}
.bottom .bubble{flex:1}
.hidden{visibility:hidden}
/* names */
.names{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-content:center;padding:10px 0}
.name{font-size:32px;font-weight:600;background:#fff;border-radius:28px;padding:26px 8px;box-shadow:0 7px 0 #E6DAFB}
.name.sel{background:#F4EEFF;box-shadow:0 0 0 5px var(--lilac),0 7px 0 #E6DAFB}
.namewrap{display:flex;gap:20px;flex:1;align-items:center}
.namewrap .avsmall{width:30%;max-width:280px}
/* build */
.build{flex:1;display:flex;gap:18px;min-height:0}
.avpanel{flex:1.05;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.6);border-radius:40px;min-height:0}
.avpanel svg{height:100%;max-height:78vh;width:100%}
.avname{position:absolute;top:12px;left:0;right:0;text-align:center;font-size:30px;font-weight:600;color:#E35D96}
.avpanel .xray{position:absolute;bottom:14px;right:14px;font-size:18px;padding:10px 16px;border-radius:20px;background:#fff;box-shadow:0 4px 0 #E0D2F7}
.avpanel .xray.on{background:#E9FFF5;box-shadow:0 0 0 3px var(--mint),0 4px 0 #BDEBD6}
.side{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
.systems{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sys{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:500;background:#fff;border-radius:22px;padding:12px 14px;box-shadow:0 5px 0 #EBDDF6;text-align:left;position:relative;min-height:64px}
.sys .ic{font-size:28px;width:36px;text-align:center}
.sys.done{background:#F0FFF8;box-shadow:0 5px 0 #BFE9D6}
.sys.done::after{content:'✓';position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#3DBE8B;font-weight:600;font-size:22px}
.sys.cur{box-shadow:0 0 0 4px var(--lilac),0 5px 0 #EBDDF6}
.sys.next{animation:wiggle 1.6s ease-in-out infinite;background:#FFF7D6;box-shadow:0 0 0 4px #FFD95A,0 5px 0 #F2D27A}
.sys.next::after{content:'✨';position:absolute;right:10px;top:6px;font-size:18px}
.learn{display:flex;gap:10px}
.learn button{flex:1;font-size:19px;font-weight:500;border-radius:22px;padding:14px 6px;background:#fff;box-shadow:0 5px 0 #F3D5E6;display:flex;flex-direction:column;align-items:center;gap:2px}
.learn button .ic{font-size:28px}
.learn button.glow{animation:pulse 1.3s ease-in-out infinite;background:#FFF3FA}
.learn.dim{opacity:.35;pointer-events:none}
.soon{display:flex;gap:10px}
.soon div{flex:1;background:rgba(255,255,255,.7);border-radius:20px;padding:10px;text-align:center;font-size:17px;color:#A893C9;border:3px dashed #E3D6F6}
.soon div b{display:block;font-size:26px}
.side .bubble{flex:1;overflow:auto;min-height:90px}
/* avatar animation */
#av.talk .bodyg,#av2.talk .bodyg,#av3.talk .bodyg,#av4.talk .bodyg{animation:talk .45s ease-in-out infinite}
.bodyg{transform-box:fill-box;transform-origin:50% 100%;animation:idle 3s ease-in-out infinite}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
.spark{position:absolute;pointer-events:none;font-size:30px;animation:spark 1.3s ease-out forwards}
.confirm{position:absolute;inset:0;background:rgba(74,59,102,.35);display:none;align-items:center;justify-content:center;z-index:9}
.confirm.on{display:flex}
.confirm > div{background:#fff;border-radius:30px;padding:26px;text-align:center;font-size:22px;display:flex;flex-direction:column;gap:16px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes idle{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.985)}}
@keyframes talk{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes wiggle{0%,100%{transform:rotate(0)}10%{transform:rotate(-2deg)}20%{transform:rotate(2deg)}30%{transform:rotate(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes spark{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translateY(-110px) scale(1.3) rotate(30deg)}}
/* settings */
.morebtns{display:flex;flex-wrap:wrap;gap:8px}
.morebtns button{font-size:16px;background:#F7F2FF;border-radius:14px;padding:9px 12px;box-shadow:0 3px 0 #E6DAFB}
.morebox{font-size:16px;line-height:1.5;color:#4A3B66;display:flex;flex-direction:column;gap:8px}
.morebox p{margin:0}
.morebox .famapp{display:flex;gap:10px;align-items:center;background:#FBF8FF;border-radius:14px;padding:8px 10px}
.morebox .famapp img{width:40px;height:40px;border-radius:10px}
.morebox .famapp div{flex:1}.morebox .famapp small{display:block;color:#8A7AA8}
.morebox a.mbtn{display:inline-block;background:#B9A2F2;color:#fff;font-weight:600;text-decoration:none;border-radius:14px;padding:9px 14px}
.morebox .qrimg{width:200px;height:200px;background:#fff;border-radius:12px;padding:6px;align-self:center}
.morebox code{word-break:break-all;background:#F4EEFF;border-radius:8px;padding:4px 8px}
.screen,.confirm{top:var(--barH,0px) !important}
.langpick{display:flex;gap:12px;justify-content:center}
.langpick button{font-size:20px;font-weight:600;background:#fff;border-radius:20px;padding:12px 20px;box-shadow:0 4px 0 #EBDDF6}
.langpick button.sel{background:#F4EEFF;box-shadow:0 0 0 4px var(--lilac),0 4px 0 #E6DAFB}
.setbox{max-width:620px;width:92%;max-height:90vh;overflow:auto;text-align:left !important;gap:10px !important;font-size:17px !important}
.setbox h3{margin:0;font-size:24px;font-weight:600}
.setl{font-weight:600;color:#8B6AE0;margin-top:4px}
.vlist{display:flex;flex-direction:column;gap:6px}
.vbtn{display:flex;gap:10px;align-items:center;text-align:left;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 0 0 2px #EEE6FF;font-size:16px}
.vbtn small{color:#A893C9;margin-left:auto}
.vbtn.sel{background:#F4EEFF;box-shadow:0 0 0 3px var(--lilac)}
#rateR{width:100%}
/* gender */
.gcards{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;padding:10px 8%}
.gcards .card{max-height:460px}
.gcards .card b{font-size:34px}
/* dress */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{flex:1;min-width:64px;font-size:26px;background:#fff;border-radius:18px;padding:6px 2px 4px;box-shadow:0 4px 0 #EBDDF6;display:flex;flex-direction:column;align-items:center}
.tab small{font-size:13px;font-weight:500}
.tab.sel{background:#FFF3FA;box-shadow:0 0 0 4px var(--pink),0 4px 0 #EBDDF6}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.it{font-size:30px;background:#fff;border-radius:18px;padding:6px 2px;box-shadow:0 4px 0 #F3D5E6;display:flex;flex-direction:column;align-items:center}
.it small{font-size:12px;font-weight:500}
.it.sel{background:#F4EEFF;box-shadow:0 0 0 4px var(--lilac),0 4px 0 #E6DAFB}
.swatches,.pats{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 3px #fff,0 3px 0 4px #EBDDF6}
.sw.sel{box-shadow:0 0 0 3px #fff,0 0 0 7px var(--lilac)}
.pt{font-size:16px;font-weight:500;background:#fff;border-radius:16px;padding:9px 12px;box-shadow:0 3px 0 #EBDDF6}
.pt.sel{background:#F4EEFF;box-shadow:0 0 0 3px var(--lilac)}
.acts{display:flex;gap:10px}
.acts button{flex:1;font-size:19px;font-weight:600;border-radius:20px;padding:12px 4px;background:#fff;box-shadow:0 5px 0 #F3D5E6}
.acts .photo{background:var(--pink);color:#fff;box-shadow:0 5px 0 #E0679A}
.soon div.ready{background:#FFF7D6;color:var(--ink);border:3px solid #FFD95A;animation:wiggle 1.6s ease-in-out infinite;cursor:pointer}
.flash{position:absolute;inset:0;background:#fff;border-radius:40px;animation:flash .6s ease-out forwards;pointer-events:none}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
#dress .side{gap:10px;overflow:auto}
/* jobs */
.jobgrid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;align-content:center;padding:10px 0;overflow:auto}
.job{background:#fff;border-radius:26px;padding:16px 8px;font-size:21px;font-weight:600;box-shadow:0 7px 0 #E6DAFB;display:flex;flex-direction:column;align-items:center;gap:4px}
.job .je{font-size:52px}
.job.sel{background:#F4EEFF;box-shadow:0 0 0 5px var(--lilac),0 7px 0 #E6DAFB}
/* work */
#scene{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:40px}
#scene span{position:absolute;font-size:44px;opacity:.55}
.badge{position:absolute;top:10px;left:14px;font-size:40px;background:#fff;border-radius:50%;width:66px;height:66px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #EBDDF6}
.stars{font-size:24px;font-weight:600;background:#fff;border-radius:18px;padding:8px 14px;box-shadow:0 4px 0 #F2E2A8}
.qcard{background:#fff;border-radius:26px;padding:16px 18px;font-size:23px;line-height:1.4;box-shadow:0 6px 0 #F3D5E6}
.qcard .qn{display:block;font-size:15px;color:#B08BD8;font-weight:500}
.choices{display:flex;flex-direction:column;gap:12px}
.ch{display:flex;gap:8px}
.chb{flex:1;display:flex;align-items:center;gap:12px;text-align:left;font-size:21px;font-weight:500;background:#fff;border-radius:22px;padding:12px 16px;box-shadow:0 6px 0 #E6DAFB;min-height:76px}
.chb .ce{font-size:40px}
.hear{width:64px;border-radius:20px;background:#F4EEFF;font-size:24px;box-shadow:0 5px 0 #E6DAFB}
.ch.yes .chb{background:#E9FFF4;box-shadow:0 0 0 4px var(--mint),0 6px 0 #BDEBD6}
.ch.no .chb{opacity:.4;text-decoration:line-through}
.dots{display:flex;gap:8px;justify-content:center}
.dots span{width:16px;height:16px;border-radius:50%;background:#EADFF7}
.dots span.now{background:var(--pink)}.dots span.done{background:var(--mint)}
.wbtns{display:flex;gap:10px;justify-content:center}
.walkin svg{animation:walkin 1.2s ease-out}
@keyframes walkin{0%{transform:translateX(-60%) rotate(-6deg)}40%{transform:translateX(-20%) rotate(5deg)}70%{transform:translateX(-5%) rotate(-3deg)}100%{transform:none}}
/* home */
#sub{overflow:auto}
.side.subopen .bubble{flex:0 0 auto;min-height:80px}
#homeMain.hidden,#sub.hidden{display:none !important}
.side.reading .bubble{display:none}
#scene4{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:40px}
#scene4 span{position:absolute;font-size:44px;opacity:.55}
.avpanel{transition:background .8s}
.avpanel.night{background:#2E2A5A !important}
.avpanel.night #scene4 span{opacity:.15}
.needs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px 14px;background:#fff;border-radius:22px;padding:10px 14px;box-shadow:0 5px 0 #EBDDF6}
.need{display:flex;align-items:center;gap:6px;font-size:22px}
.bar{flex:1;height:14px;border-radius:7px;background:#F1EAF8;overflow:hidden}
.bar i{display:block;height:100%;border-radius:7px;transition:width .6s}
.acts4{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.act{background:#fff;border-radius:18px;padding:6px 2px;font-size:14px;font-weight:500;box-shadow:0 4px 0 #EBDDF6;display:flex;flex-direction:column;align-items:center;min-height:70px;justify-content:center}
.act span{font-size:30px}
.act.next{animation:wiggle 1.6s ease-in-out infinite;background:#FFF7D6;box-shadow:0 0 0 4px #FFD95A,0 4px 0 #F2D27A}
#sub{display:flex;flex-direction:column;gap:10px;min-height:0;flex:1}
.subhead{font-size:22px;font-weight:600;display:flex;align-items:center;gap:8px}
.subhead .x{margin-left:auto;width:46px;height:46px;border-radius:14px;background:#fff;font-size:20px;box-shadow:0 4px 0 #EBDDF6}
.foods{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.food{background:#fff;border-radius:20px;padding:10px 4px;font-size:15px;font-weight:500;box-shadow:0 5px 0 #F3D5E6;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;text-align:center}
.food span{font-size:38px}
.food.nope{opacity:.4}
.food.load{background:#F4EEFF}
.note{font-size:13px;color:#A893C9}
.reader{flex:1;overflow:auto;background:#fff;border-radius:24px;padding:18px 20px;font-size:25px;line-height:1.6;box-shadow:0 6px 0 #F3D5E6;font-family:Georgia,'Times New Roman',serif}
.reader .now{background:#FFF1A8;border-radius:8px;box-shadow:0 0 0 3px #FFF1A8}
.rbtns{display:flex;gap:10px;align-items:center;justify-content:center;font-size:18px;color:#A48BC9}
.rbtns button{font-size:24px;padding:10px 20px;border-radius:18px;background:#fff;box-shadow:0 4px 0 #EBDDF6}
.piano{display:flex;gap:6px;height:90px}
.piano button{flex:1;border-radius:0 0 16px 16px;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.piano button:active{transform:translateY(4px);box-shadow:none}
.fxpop{position:absolute;font-size:56px;pointer-events:none;animation:fxpop 1.6s ease-out forwards}
@keyframes fxpop{0%{opacity:0;transform:scale(.3)}25%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:translateY(-80px) scale(1)}}
.hop svg{animation:hop .6s ease}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px)}}
.dance svg{animation:dance .9s ease-in-out infinite}
@keyframes dance{0%,100%{transform:rotate(0) translateY(0)}25%{transform:rotate(-6deg) translateY(-8px)}75%{transform:rotate(6deg) translateY(-8px)}}
.hbtns{display:flex;gap:10px}
.hbtns button{flex:1;font-size:18px;font-weight:600;border-radius:18px;padding:10px;background:#fff;box-shadow:0 4px 0 #EBDDF6}
@media (orientation:portrait){
 .build{flex-direction:column}.avpanel{flex:1}.avpanel svg{max-height:42vh}
 .cards{grid-template-columns:repeat(3,1fr)}.names{grid-template-columns:repeat(2,1fr)}
 .namewrap{flex-direction:column}.namewrap .avsmall{width:40%}
}
/* ===== advanced motion & look ===== */
button{transition:transform .28s cubic-bezier(.3,1.6,.5,1),box-shadow .2s,background .25s}
button:active{transform:scale(.93)}
.card,.job,.name,.sys,.act,.it,.food,.tab{will-change:transform}
.bgblobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgblobs i{position:absolute;border-radius:50%;opacity:.55;animation:drift 26s ease-in-out infinite alternate}
.bgblobs i:nth-child(1){width:520px;height:520px;background:radial-gradient(circle,#FFD6E7 0,transparent 68%);left:-140px;top:-120px}
.bgblobs i:nth-child(2){width:460px;height:460px;background:radial-gradient(circle,#E3D8FF 0,transparent 68%);right:-120px;top:20%;animation-duration:31s}
.bgblobs i:nth-child(3){width:400px;height:400px;background:radial-gradient(circle,#D2F5E8 0,transparent 68%);left:25%;bottom:-160px;animation-duration:36s}
.bgblobs i:nth-child(4){width:300px;height:300px;background:radial-gradient(circle,#FFF1B8 0,transparent 68%);right:20%;top:-80px;animation-duration:29s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(90px,60px) scale(1.12)}100%{transform:translate(-40px,110px) scale(.95)}}
.screen.on{animation:none}
.bodyg{animation:breathe 3.4s ease-in-out infinite !important}
@keyframes breathe{0%,100%{transform:scale(1,1) translateY(0)}50%{transform:scale(1.018,.985) translateY(1px)}}
.shadow{transform-box:fill-box;transform-origin:center;animation:shad 3.4s ease-in-out infinite}
@keyframes shad{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.04)}}
#av.talk .bodyg,#av2.talk .bodyg,#av3.talk .bodyg,#av4.talk .bodyg{animation:talkb .9s ease-in-out infinite !important}
@keyframes talkb{0%,100%{transform:rotate(0) translateY(0)}30%{transform:rotate(-1.6deg) translateY(-3px)}70%{transform:rotate(1.4deg) translateY(-2px)}}
.mouthO{opacity:0;transform-box:fill-box;transform-origin:center}
.talk .mouthO{animation:mouth .26s ease-in-out infinite alternate}
@keyframes mouth{from{opacity:0;transform:scaleY(.3)}to{opacity:1;transform:scaleY(1.05)}}
.eye{animation:look 7s ease-in-out infinite !important}
@keyframes look{0%,28%{transform:translate(0,0) scaleY(1)}32%,48%{transform:translate(2px,0) scaleY(1)}52%,70%{transform:translate(-1.5px,1px) scaleY(1)}74%,90%{transform:translate(0,0) scaleY(1)}92%{transform:scaleY(.08)}95%,100%{transform:scaleY(1)}}
.earL,.earR{transform-box:fill-box;transform-origin:50% 95%;animation:earTw 5.5s ease-in-out infinite}
.earR{animation-delay:.35s}
@keyframes earTw{0%,82%,100%{transform:rotate(0)}86%{transform:rotate(-10deg)}91%{transform:rotate(6deg)}95%{transform:rotate(-3deg)}}
.flopL{transform-box:fill-box;transform-origin:50% 6%;animation:flopL 3.4s ease-in-out infinite}
.flopR{transform-box:fill-box;transform-origin:50% 6%;animation:flopR 3.4s ease-in-out infinite}
@keyframes flopL{0%,100%{transform:rotate(0)}50%{transform:rotate(7deg)}}
@keyframes flopR{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}

<script>(function(){if(LANG!=='en')return;

/* ---------- drawing helpers ---------- */
const B='#FFF8EC',BS='#E6D3AE',M='#FF9FB8',L='#A8D8FF',T='#FFC98B',R='#FF5C7A',V='#7AA7FF',N='#FFC93C',BR='#F7B7DA',INK='#3A2E4F';
const el=(cx,cy,rx,ry,f,x='')=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${f}" ${x}/>`;
const bstroke=`stroke="${BS}" stroke-width="2"`;
function bone(x1,y1,x2,y2,w){
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${BS}" stroke-width="${w+3}" stroke-linecap="round"/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${B}" stroke-width="${w}" stroke-linecap="round"/>`+
  [[x1,y1],[x2,y2]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="${w*0.8}" fill="${B}" stroke="${BS}" stroke-width="1.5"/>`).join('');
}
function spine(x,y1,y2){let s='';for(let y=y1;y<=y2;y+=12)s+=`<rect x="${x-6}" y="${y}" width="12" height="8" rx="3" fill="${B}" stroke="${BS}" stroke-width="1.5"/>`;return s;}

   <pattern id="pstripes" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="12" fill="#fff" fill-opacity=".6"/></pattern>
   <pattern id="phearts" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M10 15 C2 10 4 4 10 7 C16 4 18 10 10 15Z" fill="#fff" fill-opacity=".8"/></pattern>
   <clipPath id="cSil">${c.sil}</clipPath>
   <radialGradient id="gShade" gradientUnits="userSpaceOnUse" cx="120" cy="105" r="240"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#3A2E4F" stop-opacity=".22"/></radialGradient>

  const dressed=built.coat;
  if(dressed&&F.back) s+=at(A.back,BACK[F.back.id].d(F.back.c,F.back.p));
  if(id==='human'&&dressed) s+=hairDraw(Lk,'back');

  for(const k of ZORDER){
    if(!built[k])continue;
    let layer='';
    if(k==='blood'){
      if(id==='bee') layer=el(150,256,50,58,'#B7E07A','opacity=".3"')+paths(['M150 306 L150 112'],'#9BCB55',7)+[262,240,218].map(y=>`<circle cx="150" cy="${y}" r="6" fill="#9BCB55"/>`).join('');
      else layer=paths(c.vessels,V,2.5,'transform="translate(4 3)"')+paths(c.vessels,R,3)+heart(...c.heartAt);

  }
  if(dressed&&!o.xray){
    if(F.top&&A.top) s+=topWear(F.top,A.top);
    if(F.shoes) s+=A.feet.map(f=>at([f[0],f[1],f[2]*(f[0]<150?-1:1),0,f[2]],SHOES[F.shoes.id].d(F.shoes.c,F.shoes.p))).join('');
    if(id==='human') s+=hairDraw(Lk,'front');

  s+=c.face+(o.gender==='girl'?c.eyes.map(([x,y,k])=>lash(x,y,k,id==='fish'?-1:(x<150?-1:1))).join(''):'');
  if(dressed&&!o.xray){

    if(F.hand) s+=at(A.hand,HOLD[F.hand.id].d(F.hand.c,F.hand.p));

  if(o.mood&&built.coat&&!o.xray){

  }
  s+=`</g></svg>`;
  const u='u'+(++RC);
  return s.replace(/cBee|cFish|scales|cTop|cSil|gShade|pdots|pstripes|phearts|pstars/g,m=>m+u);
}

let voice=null,tok=0;
const VOICE_LANG='en';
const VOICE_TIP={
 en:"The app speaks with the voices installed on this tablet, so a better voice on the tablet means a better voice here. For the most natural British voice: iPad: Settings → Accessibility → Spoken Content → Voices → English → English (UK) → download “Serena (Premium)” or “Kate (Enhanced)”. Android: Settings → Text-to-speech → Google → install English (United Kingdom) voice data and pick the voice you like. Then choose it in the list above.",
 pl:"Aplikacja mówi głosami zainstalowanymi na tablecie, więc lepszy głos na tablecie to lepszy głos tutaj. Najbardziej naturalny polski głos: iPad: Ustawienia → Dostępność → Treść mówiona → Głosy → Polski → pobierz „Zosia (rozszerzony)”. Android: Ustawienia → Zamiana tekstu na mowę → Google → zainstaluj dane głosowe „polski” i wybierz głos. Potem wybierz go na liście powyżej."};
function vScore(v){
  const n=(v.name+' '+(v.voiceURI||'')).toLowerCase(),L=(v.lang||'').toLowerCase().replace('_','-');let s=0;
  if(/bad news|bahh|bells|boing|bubbles|cellos|jester|organ|trinoids|whisper|zarvox|albert|\bfred\b|junior|ralph|superstar|wobble|good news|grandma|grandpa|rocko|shelley|sandy|\breed\b|\beddy\b|\bflo\b/.test(n))return -999;
  if(VOICE_LANG==='en'){
    if(L==='en-gb')s+=50;else if(L.startsWith('en'))s+=5;else return -500;
    if(/serena|kate|martha|stephanie|libby|sonia|maisie|hazel|bella|emma|amy|olivia|female|gba|gbc|gbg/.test(n))s+=25;
    if(/daniel|arthur|oliver|george|ryan|thomas|(^|[^e])male|gbb|gbd|rjs/.test(n))s-=40;
  } else {
    if(L.startsWith('pl'))s+=50;else return -500;
    if(/zosia|paulina|ewa|agnieszka|zofia|maja|female|pla|plb|ple/.test(n))s+=25;
    if(/krzysztof|jacek|marek|(^|[^e])male|pld/.test(n))s-=40;
  }
  if(/premium/.test(n))s+=40;if(/enhanced|rozszerzon|wysok/.test(n))s+=30;if(/natural|neural|wavenet|studio/.test(n))s+=35;
  if(/google/.test(n))s+=8;if(v.localService)s+=3;
  return s;
}
function voiceList(){if(!('speechSynthesis' in window))return[];return speechSynthesis.getVoices().map(v=>({v,s:vScore(v)})).filter(x=>x.s>-100).sort((a,b)=>b.s-a.s).map(x=>x.v);}
function pickVoice(){const vs=voiceList();let saved=null;try{saved=localStorage.getItem('buddyVoice_'+VOICE_LANG);}catch(e){}
  voice=(saved&&vs.find(v=>v.voiceURI===saved))||vs[0]||null;const st=document.getElementById('settings');if(st&&st.classList.contains('on'))drawVoices();}
let rate=1;try{rate=+localStorage.getItem('buddyRate')||1;}catch(e){}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function caption(parts,i,el){
  if(el){el.innerHTML=parts.map((p,j)=>`<span class="${j===i?'now':''}">${p}</span>`).join(' ');const n=el.querySelector('.now');if(n)n.scrollIntoView({block:'nearest'});return;}
  const sc=document.querySelector('.screen.on [data-cap]');if(!sc)return;
  sc.innerHTML=`<span class="who">${S.name?S.name+' says':'Your guide says'}</span>`+parts.map((p,j)=>`<span class="${j===i?'now':''}">${p}</span>`).join(' ');
}
function talking(on){['av','av2','av3','av4'].forEach(x=>{const a=document.getElementById(x);if(a)a.classList.toggle('talk',on);});}
function say(text,then,el){
  const my=++tok;
  const parts=(text.match(/[^.!?]+[.!?]+["”'’]?|[^.!?]+$/g)||[text]).map(s=>s.trim()).filter(Boolean);
  caption(parts,-1,el);
  const finish=()=>{if(my!==tok)return;tok++;const t2=tok;talking(false);caption(parts,-1,el);if(then)setTimeout(()=>{if(t2===tok)then()},450);};
  if(muted||!('speechSynthesis' in window)){talking(false);if(then)setTimeout(()=>{if(my===tok)then()},1200);return;}
  try{speechSynthesis.cancel();}catch(e){}
  /* group sentences into smooth chunks: fewer breaks, more natural flow */
  const groups=[];let cur=[],len=0;
  parts.forEach((p,i)=>{if(cur.length&&len+p.length>220){groups.push(cur);cur=[];len=0;}cur.push(i);len+=p.length+1;});
  if(cur.length)groups.push(cur);
  let left=groups.length;talking(true);
  setTimeout(()=>{
    if(my!==tok)return;
    groups.forEach(g=>{
      const txt=g.map(i=>parts[i]).join(' ');
      const u=new SpeechSynthesisUtterance(txt);
      u.lang=VOICE_LANG==='en'?'en-GB':'pl-PL';if(voice){u.voice=voice;u.lang=voice.lang;}
      u.rate=(slow?0.82:0.97)*rate;u.pitch=1.0;u.volume=1;
      const starts=[];let pos=0;g.forEach(i=>{starts.push(pos);pos+=parts[i].length+1;});
      u.onstart=()=>{if(my===tok)caption(parts,g[0],el);};
      u.onboundary=e=>{if(my!==tok||e.charIndex==null)return;let k=0;for(let j=0;j<starts.length;j++)if(e.charIndex>=starts[j])k=j;caption(parts,g[k],el);};
      const fin=()=>{if(my!==tok)return;if(--left<=0)finish();};
      u.onend=fin;u.onerror=fin;
      speechSynthesis.speak(u);
    });
    /* watchdog: if the device never starts speaking, keep the app moving */
    setTimeout(()=>{if(my===tok&&!speechSynthesis.speaking&&!speechSynthesis.pending)finish();},2500);
  },70);
}

function pickItem(id){

  const nm=CATS[tab][id].n;say(`${nm[0].toUpperCase()+nm.slice(1)}! ${rnd(CHEERS())}`);

function pickColour(c){

/* ---------- jobs screen ---------- */
let tmpJ=null;
function jobOf(){return (JOBS[S.creature]||[]).find(j=>j.id===S.job);}
function openJobs(){
  show('jobs');tmpJ=null;$('pickJ').classList.add('hidden');
  $('jobGrid').innerHTML=JOBS[S.creature].map(j=>`<button class="job ${j.id===S.job?'sel':''}" data-j="${j.id}"><span class="je">${j.e}</span>${j.n}</button>`).join('');
  $('jobGrid').querySelectorAll('.job').forEach(bt=>bt.onclick=()=>{
    tmpJ=bt.dataset.j;$('jobGrid').querySelectorAll('.job').forEach(x=>x.classList.toggle('sel',x===bt));
    $('pickJ').classList.remove('hidden');
    const j=JOBS[S.creature].find(x=>x.id===tmpJ);
    say(`${j.n}! ${j.d}`,()=>say(`Do you want ${S.name} to be a ${j.n.toLowerCase()}? Tap: this job!`));
  });
  const extra=S.creature==='human'?'':` Animals have jobs too! They help nature and help people.`;
  say(`What job would ${S.name} like to do?${extra} Tap a picture to hear about each job.`);
}
$('pickJ').onclick=()=>{if(!tmpJ)return;S.job=tmpJ;S.day=S.day||0;save();openWork();};
$('backJ').onclick=()=>openBuild(true);

/* ---------- work day ---------- */
let W=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const k=Math.floor(Math.random()*(i+1));[a[i],a[k]]=[a[k],a[i]];}return a;}
function openWork(){
  const j=jobOf();if(!j){openJobs();return;}
  show('work');
  const skip=(S.day||0)%j.sc.length;
  W={j,list:shuffle(j.sc.filter((_,i)=>i!==skip)),i:-1,earned:0};
  $('avp3').style.background=j.bg;
  $('scene').innerHTML=j.deco.map((e,i)=>`<span style="left:${[6,78,12,82,45][i]}%;top:${[8,12,70,66,4][i]}%">${e}</span>`).join('');
  $('avName3').textContent=S.name;$('badge').textContent=j.e;
  $('av3').innerHTML=render(S.creature,S.built,OPT());$('av3').classList.add('walkin');setTimeout(()=>$('av3').classList.remove('walkin'),1300);
  updWorkTop();
  $('choices').innerHTML='';$('nextQ').classList.add('hidden');$('goHome').classList.add('hidden');
  say(`Good morning! It's day ${(S.day||0)+1} at work. ${S.name} the ${j.n.toLowerCase()} is going to ${j.place}! Let's see what happens today.`,()=>nextScene());
}
function updWorkTop(){
  $('workTitle').innerHTML=`Day ${(S.day||0)+1}: <span>${W.j.n}</span>`;$('workTitle').innerHTML+=` <small class="rank">${rankName(W.j.id)}</small>`;
  $('stars').textContent='⭐ '+(S.stars||0);
  $('dots').innerHTML=W.list.map((_,i)=>`<span class="${i<W.i?'done':i===W.i?'now':''}"></span>`).join('');
}
function sceneSpeech(s,opts){return s.q+' '+opts.map((o,i)=>(i?'Or: ':'')+o[1]+'?').join(' ');}
function nextScene(){
  W.i++;$('nextQ').classList.add('hidden');
  if(W.i>=W.list.length){endDay();return;}
  const s=W.list[W.i],opts=shuffle(s.a);W.opts=opts;W.tries=0;updWorkTop();
  $('qcard').innerHTML=`<span class="qn">Job ${W.i+1} of ${W.list.length}</span>${s.q}`;
  $('choices').innerHTML=opts.map((o,k)=>`<div class="ch" data-k="${k}"><button class="chb" data-k="${k}"><span class="ce">${o[0]}</span><span>${o[1]}</span></button><button class="hear" data-h="${k}" aria-label="Hear this">🔊</button></div>`).join('');
  $('choices').querySelectorAll('.chb').forEach(bt=>bt.onclick=()=>choose(+bt.dataset.k));
  $('choices').querySelectorAll('.hear').forEach(bt=>bt.onclick=()=>say(opts[+bt.dataset.h][1]));
  say(sceneSpeech(s,opts));
}
function choose(k){
  const o=W.opts[k],row=$('choices').querySelector(`.ch[data-k="${k}"]`);
  if(row.classList.contains('no'))return;
  if(o[2]){
    row.classList.add('yes');$('choices').querySelectorAll('.chb').forEach(x=>x.onclick=null);
    S.stars=(S.stars||0)+1;W.earned++;gain(10);save();updWorkTop();sparkle3();
    say(`${rnd(['Great choice!','Yes, well done!','Brilliant!','Super!'])} ${o[3]}`,()=>{$('nextQ').classList.remove('hidden');say(W.i+1<W.list.length?'Tap next for the next job!':'Tap next to finish work!');});
    $('nextQ').classList.add('hidden');
  } else {
    row.classList.add('no');W.tries++;
    say(`Hmm, let's think. ${o[3]} Let's try again!`);
  }
}
$('nextQ').onclick=nextScene;
function endDay(){
  S.day=(S.day||0)+1;jobDayDone();save();
  $('qcard').innerHTML=`<span class="qn">All done!</span>🎉 Work is finished!`;$('choices').innerHTML='';
  $('goHome').classList.remove('hidden');sparkle3();setTimeout(sparkle3,500);
  const P_=P();
  say(`Hooray! Work is finished for today! ${S.name} earned ${W.earned} stars, and now has ${S.stars} stars altogether. ${P_.He} worked hard, so now ${P_.he} needs to go home, eat and rest. Tap the house to go home!`);
}
function sparkle3(){const p=$('avp3');for(let i=0;i<12;i++){const s=document.createElement('span');s.className='spark';s.textContent=['⭐','✨','💖','🌟','💫'][i%5];
  s.style.left=(15+Math.random()*70)+'%';s.style.top=(25+Math.random()*55)+'%';s.style.animationDelay=(Math.random()*.4)+'s';p.appendChild(s);setTimeout(()=>s.remove(),1900);}}
$('goHome').onclick=()=>openHome(true);
$('backW').onclick=()=>openBuild(true);
$('changeJob').onclick=openJobs;
$('av3').onclick=()=>say(rnd(GIGGLE));
function goWork(){if(!S.job)openJobs();else openWork();}

$('toWork').onclick=goWork;

const STORIES=[
 {e:'🐢',t:'The Tortoise and the Hare',src:"Aesop's fable",p:["Once upon a time, a speedy hare laughed at a slow tortoise. \"You're so slow!\" said the hare.","\"Let's have a race,\" said the tortoise calmly. All the animals came to watch.","Off they went! The hare zoomed ahead, so far that the tortoise was just a little dot behind him.","\"I'm so far ahead,\" yawned the hare. \"I'll have a little nap.\" And he fell fast asleep under a tree.","The tortoise kept going. Step, step, step. Slowly, but he never stopped.","When the hare woke up, he ran as fast as he could. But the tortoise was already crossing the finish line!","The moral of the story: slow and steady wins the race. Keep trying, and don't give up!"]},
 {e:'🦁',t:'The Lion and the Mouse',src:"Aesop's fable",p:["A big lion was sleeping in the sun, when a little mouse ran across his nose.","The lion woke up and caught the mouse in his giant paw. \"Please let me go!\" squeaked the mouse. \"One day, I might help you.\"","The lion laughed. \"How could a tiny mouse help a big lion?\" But he was kind, and he let the mouse go.","A few days later, the lion got caught in a hunter's net. He roared and roared, but he couldn't get out.","The little mouse heard him. She ran over and nibbled the ropes with her sharp teeth, nibble, nibble, until the lion was free!","\"Thank you, little friend,\" said the lion. \"You were right. Even the smallest friend can be a big help.\"","The moral: be kind to everyone. Little friends can do great things!"]},
 {e:'🐜',t:'The Ant and the Grasshopper',src:"Aesop's fable",p:["All summer long, a little ant worked hard, carrying seeds and grain to her nest.","A grasshopper played his fiddle and sang in the sunshine. \"Why work so hard? Come and play!\"","\"I'm saving food for winter,\" said the ant. \"You should too!\" But the grasshopper just kept singing.","Then winter came. Snow covered the ground, and there was nothing to eat.","The hungry grasshopper knocked on the ant's door. The kind ant shared some food, and the grasshopper said, \"Next summer, I'll get ready for winter too.\"","The moral: it's good to play, but it's also good to get ready for the days ahead."]},
 {e:'🐦‍⬛',t:'The Crow and the Pitcher',src:"Aesop's fable",p:["On a hot, dry day, a thirsty crow found a tall jug with a little water at the bottom.","She pushed her beak in, but she couldn't reach the water. Her beak was too short!","The crow had an idea. She picked up a little pebble and dropped it into the jug. Plop!","Then another pebble. Plop! And another. Plop, plop, plop!","With every pebble, the water rose higher and higher, until it reached the top.","The clever crow drank and drank. \"Ahh, lovely!\"","The moral: when something is hard, think, and try a clever new way! Scientists do this too."]},
 {e:'🐭',t:'Town Mouse and Country Mouse',src:"Aesop's fable",p:["A country mouse lived in a cosy hole in a field. One day, her cousin from the town came to visit.","The country mouse served barley, roots and seeds. \"How plain!\" said the town mouse. \"Come to town with me, I'll show you real food!\"","In the big town house, there were cakes, cheese and jelly! The mice started to eat.","Suddenly, the door banged open! People came in, and a big cat ran after them. The mice hid, shaking with fright.","\"Goodbye, cousin,\" said the country mouse. \"I'd rather eat simple seeds in peace, than cake and be scared!\"","The moral: a calm, happy home is worth more than fancy things."]},
 {e:'🐔',t:'The Little Red Hen',src:"Folk tale",p:["The little red hen found some grains of wheat. \"Who will help me plant this wheat?\" she asked.","\"Not I,\" said the dog. \"Not I,\" said the cat. \"Not I,\" said the duck. \"Then I'll do it myself,\" said the hen. And she did.","The wheat grew tall and golden. \"Who will help me cut the wheat, and take it to the mill to make flour?\" \"Not I, not I, not I!\"","So the hen did it all herself. \"Who will help me bake the bread?\" \"Not I, not I, not I!\" So she baked it herself.","Mmm! The warm bread smelled wonderful. \"Who will help me eat the bread?\" \"I will!\" said the dog, the cat and the duck.","\"You didn't help me plant, cut or bake,\" said the hen. \"Next time, let's all work together, and then we'll all share!\"","The moral: when we work together, everyone can share the good things."]},
 {e:'🐷',t:'The Three Little Pigs',src:"Folk tale",p:["Three little pigs went out to build their own houses.","The first pig built a house of straw, very quickly. The second pig built a house of sticks, quite quickly.","The third pig built a house of bricks. It took a long time, and it was hard work.","Along came a big, bad wolf. \"Little pig, let me come in!\" He huffed and puffed, and blew the straw house down! The pig ran to his brother's stick house.","The wolf huffed and puffed, and blew the stick house down too! Both pigs ran to the brick house.","The wolf huffed and puffed, and puffed and huffed, but the brick house stood strong! The tired wolf gave up and ran away.","The moral: doing a job carefully and properly is worth the hard work. And the three pigs lived happily together!"]},
 {e:'🐻',t:'Goldilocks and the Three Bears',src:"Folk tale",p:["Once upon a time, three bears lived in a house in the woods: Daddy Bear, Mummy Bear and Baby Bear.","One morning their porridge was too hot, so they went for a walk while it cooled down.","A girl called Goldilocks found the house and walked right in. She tasted the porridge. Daddy Bear's was too hot. Mummy Bear's was too cold. Baby Bear's was just right, and she ate it all up!","She sat in the chairs. Too hard, too soft, and just right. But Baby Bear's little chair broke! Crash!","She tried the beds. Too hard, too soft, and just right. And Goldilocks fell fast asleep in Baby Bear's bed.","The bears came home. \"Someone's been eating my porridge, and they've eaten it all up!\" cried Baby Bear. Then they found Goldilocks asleep!","Goldilocks woke up, jumped out of the window and ran home. She learned that you should never go into someone's house without asking!"]}

function freq(n){const m=n.match(/^([A-G])(#?)(\d)$/);const k={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]?1:0);return 440*Math.pow(2,(k+12*(+m[3]+1)-69)/12);}
function impulse(sec,decay){const r=AC.sampleRate,l=Math.floor(r*sec),b=AC.createBuffer(2,l,r);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<l;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/l,decay);}return b;}

    const comp=AC.createDynamicsCompressor();comp.threshold.value=-20;comp.ratio.value=3;comp.attack.value=0.01;comp.release.value=0.25;
    MASTER=AC.createGain();MASTER.gain.value=0.85;
    const dry=AC.createGain();dry.gain.value=0.78;const wet=AC.createGain();wet.gain.value=0.32;
    const rev=AC.createConvolver();rev.buffer=impulse(2.6,2.8);
    const warm=AC.createBiquadFilter();warm.type='lowshelf';warm.frequency.value=300;warm.gain.value=3;
    MASTER.connect(dry);MASTER.connect(rev);rev.connect(wet);dry.connect(warm);wet.connect(warm);warm.connect(comp);comp.connect(AC.destination);}
  if(AC.state==='suspended')AC.resume();return true;}catch(e){return false;}}
/* soft felt-piano voice: sine partials, gentle attack, natural decay, filter closes as it rings */
function pianoNote(f,t,d,vel=0.55){
  const out=AC.createGain(),lp=AC.createBiquadFilter();lp.type='lowpass';lp.Q.value=0.2;
  lp.frequency.setValueAtTime(Math.min(8000,f*6),t);lp.frequency.exponentialRampToValueAtTime(Math.max(400,f*1.6),t+d+0.8);
  out.gain.setValueAtTime(0.0001,t);out.gain.linearRampToValueAtTime(vel*0.26,t+0.018);
  out.gain.setTargetAtTime(vel*0.1,t+0.02,0.18);out.gain.setTargetAtTime(0.0001,t+d,0.32);
  const end=t+d+1.8;
  [[1,1,'sine'],[2,0.28,'sine'],[3,0.08,'sine'],[1.0015,0.22,'triangle']].forEach(([m,a,ty])=>{
    const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f*m;g.gain.value=a;o.connect(g);g.connect(lp);o.start(t);o.stop(end);});
  lp.connect(out);out.connect(MASTER);
}
/* warm pad for the chords underneath */
function pad(fs,t,d,vol=0.045){
  const out=AC.createGain(),lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;
  out.gain.setValueAtTime(0.0001,t);out.gain.linearRampToValueAtTime(vol,t+0.4);out.gain.setTargetAtTime(0.0001,t+d,0.4);
  fs.forEach(f=>[0.997,1.003].forEach(dt=>{const o=AC.createOscillator();o.type='sine';o.frequency.value=f*dt;o.connect(lp);o.start(t);o.stop(t+d+2.5);}));
  lp.connect(out);out.connect(MASTER);
}
function tone(f,t,d,vol){pianoNote(f,t,d,vol?Math.min(0.9,vol*3):0.6);}
const PC={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function harmonise(notes,key,win,total){
  const chords=[[0,4,7],[5,9,0],[7,11,2],[9,0,4]],res=[];
  for(let w=0;w<total;w+=win){
    let best=0,bs=-1;
    chords.forEach((ch,ci)=>{let s=ci===0?0.3:0;notes.forEach(n=>{const ov=Math.min(n.s+n.d,w+win)-Math.max(n.s,w);if(ov>0&&ch.includes((n.pc-key+12)%12))s+=ov*(Math.max(n.s,w)===w?1.3:1);});if(ci===3)s-=0.2;if(s>bs){bs=s;best=ci;}});
    if(w+win>=total)best=0;res.push({s:w,ch:chords[best]});
  }
  return res;
}
function playSong(s,opts={}){
  stopSong();if(!ensureAC())return;
  const beat=60/s.bpm,t0=AC.currentTime+0.2,key=s.key||0,win=s.win||2;let b=0;const notes=[];
  for(const tk of s.n.split(/\s+/)){const [nm,d]=tk.split(':');const dd=d?+d:1;notes.push({nm,s:b,d:dd,pc:PC[nm[0]]+(nm[1]==='#'?1:0)});b+=dd;}
  const vol=opts.vol?opts.vol/0.22:1;
  notes.forEach((n,i)=>{const hum=(Math.random()-0.5)*0.012,v=(0.5+(n.s%win===0?0.1:0)+Math.random()*0.06)*vol;
    pianoNote(freq(n.nm),t0+n.s*beat+hum,n.d*beat*1.02,v);});
  harmonise(notes,key,win,b).forEach(c=>{
    const st=t0+c.s*beat,dur=win*beat;
    const root=130.81*Math.pow(2,((c.ch[0]+key)%12)/12);
    pad(c.ch.map(p=>261.63*Math.pow(2,((p+key)%12)/12)),st,dur,0.04*vol);
    pianoNote(root/2*2,st,dur*0.9,0.32*vol);
  });
  const len=(b*beat+0.4)*1000;
  const id=setTimeout(()=>{playing=null;if(!opts.loop)danceOff();if(opts.loop)playSong(s,opts);else if(opts.then)opts.then();},len+900);
  playing={id,s};if(!opts.quiet)danceOn();
}
function stopSong(){if(playing){clearTimeout(playing.id);playing=null;}if(AC){try{AC.close();}catch(e){}AC=null;MASTER=null;}danceOff();}

const needXP=l=>30*l*(l+1);
function lvlOf(xp){let l=1;while(xp>=needXP(l))l++;return l;}
function stat(k,n=1){S.stats=S.stats||{};S.stats[k]=(S.stats[k]||0)+n;checkBadges();}
function gain(n){const before=lvlOf(S.xp||0);S.xp=(S.xp||0)+n;const after=lvlOf(S.xp);save();paintLvl(true);
  if(after>before){const t=TITLES[VOICE_LANG][Math.min(after-1,8)];setTimeout(()=>{confetti(document.querySelector('.screen.on .avpanel'),70);
    toast(`⭐ ${TR('Level','Poziom')} ${after}: <b>${t}</b>!`);},400);}

function gainOnce(key,n){S.seen=S.seen||{};if(S.seen[key])return;S.seen[key]=1;gain(n);}

function checkBadges(){S.stats=S.stats||{};S.badges=S.badges||{};

    setTimeout(()=>{confetti(document.querySelector('.screen.on .avpanel')||document.body,60);toast(`${e} ${TR('New badge','Nowa odznaka')}: <b>${TR(en,pl)}</b>!`);},700);}}});}
function paintLvl(bump){
  const xp=S.xp||0,l=lvlOf(xp),lo=l>1?needXP(l-1):0,hi=needXP(l),pc=Math.max(0,Math.min(1,(xp-lo)/(hi-lo)));
  document.querySelectorAll('.lvl').forEach(c=>{c.innerHTML=`<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="#EEE6FF" stroke-width="5"/><circle cx="20" cy="20" r="16" fill="none" stroke="#B197FC" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(pc*100.5).toFixed(1)} 200" transform="rotate(-90 20 20)"/></svg><b>${l}</b>`;
    if(bump)try{c.animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:500,easing:SPRING});}catch(e){}});
}

const SCI={
 bones:{en:"Science level! Your skeleton has two main parts. The axial skeleton is the skull, spine and ribs. The appendicular skeleton is your arms, legs, shoulders and hips. The spine is a stack of small bones called vertebrae, with soft discs between them as shock absorbers. The longest bone is the femur, in your thigh. Bones store calcium, and the red marrow inside makes about two million new red blood cells every second!",
  pl:"Poziom naukowy! Szkielet ma dwie główne części. Szkielet osiowy to czaszka, kręgosłup i żebra. Szkielet kończyn to ręce, nogi, obręcz barkowa i miednica. Kręgosłup to stos małych kości, zwanych kręgami, a między nimi są miękkie krążki, które amortyzują wstrząsy. Najdłuższa kość to kość udowa. Kości magazynują wapń, a czerwony szpik w środku robi około dwóch milionów nowych czerwonych krwinek na sekundę!"},
 muscles:{en:"There are three kinds of muscle. Skeletal muscles move your bones, and you control them. Smooth muscles squeeze food along your intestines without you thinking about it. Cardiac muscle is found only in the heart. Skeletal muscles are joined to bones by tough cords called tendons. Your biceps bends your arm and your triceps straightens it. A pair like this, pulling in opposite directions, is called antagonistic muscles.",
  pl:"Są trzy rodzaje mięśni. Mięśnie szkieletowe poruszają kośćmi i to ty nimi sterujesz. Mięśnie gładkie przesuwają jedzenie w jelitach, bez twojego myślenia. Mięsień sercowy jest tylko w sercu. Mięśnie szkieletowe łączą się z kośćmi mocnymi sznurami, zwanymi ścięgnami. Biceps zgina rękę, a triceps ją prostuje. Taka para, która ciągnie w przeciwne strony, to mięśnie antagonistyczne."},
 blood:{en:"The heart has four rooms, called chambers: two atria on top and two ventricles below. The right side pumps blood to the lungs to collect oxygen, and the left side pumps it around the whole body. Blood contains red blood cells that carry oxygen, white blood cells that fight germs, and platelets that plug cuts. The tiniest vessels, capillaries, are so narrow that blood cells squeeze through them one at a time!",
  pl:"Serce ma cztery komory: dwa przedsionki na górze i dwie komory na dole. Prawa strona pompuje krew do płuc po tlen, a lewa wysyła ją do całego ciała. We krwi są czerwone krwinki, które niosą tlen, białe krwinki, które walczą z zarazkami, i płytki krwi, które zatykają skaleczenia. Najmniejsze naczynia, naczynia włosowate, są tak wąskie, że krwinki przeciskają się przez nie pojedynczo!"},

  pl:"Powietrze płynie tchawicą, która dzieli się na dwa oskrzela, potem na tysiące oskrzelików, aż do pęcherzyków płucnych. Każdy pęcherzyk oplatają naczynia włosowate, więc tlen przechodzi do krwi, a dwutlenek węgla wychodzi. Ta wymiana to wymiana gazowa. Mięsień w kształcie kopuły pod płucami, przepona, ciągnie w dół i wciąga powietrze. Czkawka to drganie przepony!"},
 nerves:{en:"Your brain has parts with different jobs. The cerebrum, the biggest part, thinks, remembers and controls movement. The cerebellum at the back keeps you balanced. The brainstem runs automatic jobs like breathing and heartbeat. Messages travel along neurons as tiny electrical signals. If you touch something hot, your spinal cord makes you pull away before your brain even notices. That's a reflex!",
  pl:"Mózg ma części z różnymi zadaniami. Kresomózgowie, największa część, myśli, pamięta i steruje ruchem. Móżdżek z tyłu dba o równowagę. Pień mózgu prowadzi automatyczne zadania, jak oddychanie i bicie serca. Wiadomości płyną neuronami jako malutkie sygnały elektryczne. Kiedy dotkniesz czegoś gorącego, rdzeń kręgowy cofa rękę, zanim mózg w ogóle to zauważy. To odruch!"},
 tummy:{en:"Digestion starts in the mouth, where enzymes in saliva begin breaking food down. Food travels down the oesophagus, pushed by waves of muscle called peristalsis, so you could even swallow upside down! The stomach uses acid. The liver makes bile to break up fat. The small intestine is lined with millions of finger-like villi that soak up nutrients, and the large intestine takes back water. What's left becomes poo.",
  pl:"Trawienie zaczyna się w buzi, gdzie enzymy w ślinie zaczynają rozkładać jedzenie. Jedzenie płynie przełykiem, pchane falami mięśni, czyli perystaltyką, więc dałoby się połykać nawet do góry nogami! Żołądek używa kwasu. Wątroba robi żółć, która rozbija tłuszcz. Jelito cienkie ma miliony malutkich palczastych kosmków, które wchłaniają składniki odżywcze, a jelito grube odzyskuje wodę. Reszta to kupa."},

const FUR={en:"Each hair grows from a pocket in the skin called a follicle. Mammals can make their fur stand up to trap more warm air. People do it too, and that's what makes goosebumps! Many animals have two layers: a soft undercoat for warmth and longer guard hairs that keep out water.",

function quizStep(){
  if(QS.i>=QS.list.length){const all=QS.ok===QS.list.length;
    $('qbox').innerHTML=`<div class="qhead">🧠 ${TR('Quiz','Quiz')}</div><div class="qres">${all?'🏆':'⭐'} ${QS.ok} / ${QS.list.length}</div><button class="bigbtn" id="qDone">${TR('Done','Gotowe')}</button>`;
    if(all)confetti($('qbox'),60);$('qDone').onclick=()=>$('quiz').classList.remove('on');
    say(all?TR('Perfect score! You really know your stuff!','Wszystko dobrze! Naprawdę dużo wiesz!'):TR(`You got ${QS.ok} out of ${QS.list.length}. Great try! You can play again any time.`,`Dobre odpowiedzi: ${QS.ok} z ${QS.list.length}. Super próba! Możesz zagrać jeszcze raz.`));return;}
  const d=QS.list[QS.i][VOICE_LANG],ans=shuffle([1,2,3]);
  $('qbox').innerHTML=`<div class="qhead">🧠 ${TR('Quiz','Quiz')} · ${QS.i+1}/${QS.list.length}</div><div class="qq">${d[0]}</div>`+
    ans.map(a=>`<button class="qa" data-a="${a}">${d[a]}</button>`).join('')+`<div class="qx" id="qx"></div>`;
  stag($('qbox').querySelectorAll('.qa'),80);
  let tried=false;
  $('qbox').querySelectorAll('.qa').forEach(b=>b.onclick=()=>{
    if(b.classList.contains('no')||$('qbox').querySelector('.qa.yes'))return;
    if(+b.dataset.a===1){b.classList.add('yes');if(!tried){QS.ok++;stat('quiz');gain(15);}confetti(b,30);
      $('qx').textContent=d[4];say(TR('Correct! ','Dobrze! ')+d[4],()=>{QS.i++;quizStep();});}
    else{tried=true;b.classList.add('no');try{b.animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],{duration:350});}catch(e){}
      say(TR('Not quite. Try again!','Jeszcze nie. Spróbuj ponownie!'));}
  });
  say(d[0]+' '+ans.map(a=>d[a]).join(TR('? Or ','? Czy ')).replace(/^/, '')+'?');
}

 {id:'archimedes',era:'greece',e:'🛁',p:['m','#E8B48E','#5A4636','curly','#FFF4D6','','beard'],
  en:['Archimedes','c. 287–212 BC','mathematician and inventor',"Archimedes was a brilliant inventor from Syracuse. The story goes that, while getting into his bath, he noticed the water rising and realised how to measure the volume of a crown. He was so excited he shouted Eureka, which means I've found it! He also explained how levers work.","What made Archimedes shout Eureka?","the water rising in his bath","finding gold coins","seeing a rainbow","Things push water out of the way, and that helps us measure their volume."],
  pl:['Archimedes','ok. 287–212 p.n.e.','matematyk i wynalazca',"Archimedes był genialnym wynalazcą z Syrakuz. Według opowieści, wchodząc do wanny, zauważył, że woda się podnosi, i zrozumiał, jak zmierzyć objętość korony. Tak się ucieszył, że zawołał: Eureka, czyli znalazłem! Wyjaśnił też, jak działa dźwignia.","Dlaczego Archimedes zawołał: Eureka?","bo woda w wannie się podniosła","bo znalazł złote monety","bo zobaczył tęczę","Przedmioty wypychają wodę, a to pomaga zmierzyć ich objętość."]},
 {id:'zhang',era:'rome',e:'🐉',p:['m','#F2D3B0','#1E1A1A','bun','#C9E4D6','',''],
  en:['Zhang Heng','78–139','astronomer and inventor',"Zhang Heng lived in China. In the year 132 he built the first seismoscope, a bronze jar with eight dragons. When the ground shook, a dragon dropped a ball into the mouth of a bronze toad, showing which direction the shaking came from.","What did Zhang Heng's dragon jar detect?","earthquakes","rain","the time","His invention could sense earthquakes far away."],
  pl:['Zhang Heng','78–139','astronom i wynalazca',"Zhang Heng żył w Chinach. W roku 132 zbudował pierwszy sejsmoskop, brązowy dzban z ośmioma smokami. Kiedy ziemia drżała, smok upuszczał kulkę do pyszczka brązowej ropuchy i pokazywał, z której strony przyszły wstrząsy.","Co wykrywał smoczy dzban Zhang Henga?","trzęsienia ziemi","deszcz","godzinę","Jego wynalazek wyczuwał nawet dalekie trzęsienia ziemi."]},
 {id:'galen',era:'rome',e:'🩺',p:['m','#E8B48E','#4A3A2E','curly','#FFFFFF','','beard'],
  en:['Galen','129–c. 216','doctor',"Galen started as a doctor for gladiators and later treated Roman emperors. He showed that arteries carry blood, not air, as people believed before. His books were used by doctors for about 1,300 years, even though some of his ideas were later proved wrong.","Galen showed that arteries carry...","blood","air","water","Before Galen, many people thought arteries were full of air!"],
  pl:['Galen','129–ok. 216','lekarz',"Galen zaczynał jako lekarz gladiatorów, a potem leczył rzymskich cesarzy. Pokazał, że tętnicami płynie krew, a nie powietrze, jak wcześniej sądzono. Lekarze korzystali z jego książek przez około 1300 lat, chociaż część jego pomysłów okazała się później błędna.","Galen pokazał, że tętnicami płynie...","krew","powietrze","woda","Przed Galenem wielu ludzi myślało, że tętnice są pełne powietrza!"]},
 {id:'hypatia',era:'rome',e:'🔭',p:['f','#E8B48E','#3A2A1E','long','#E3D8FF','',''],
  en:['Hypatia','c. 360–415','mathematician and astronomer',"Hypatia was one of the most famous teachers in Alexandria, in Egypt. She taught mathematics, astronomy and philosophy, and wrote about geometry. Students travelled from far away to learn from her.","Which city did Hypatia teach in?","Alexandria","London","Paris","Alexandria had one of the greatest libraries of the ancient world."],
  pl:['Hypatia','ok. 360–415','matematyczka i astronomka',"Hypatia była jedną z najsłynniejszych nauczycielek w Aleksandrii, w Egipcie. Uczyła matematyki, astronomii i filozofii, i pisała o geometrii. Uczniowie przyjeżdżali z daleka, żeby się od niej uczyć.","W którym mieście uczyła Hypatia?","w Aleksandrii","w Londynie","w Paryżu","Aleksandria miała jedną z największych bibliotek starożytnego świata."]},
 {id:'khwarizmi',era:'middle',e:'➗',p:['m','#C68E62','#1E1A1A','short','#BFE3D6','turban','beard'],
  en:['Al-Khwarizmi','c. 780–850','mathematician',"Al-Khwarizmi worked at the House of Wisdom in Baghdad. His book gave us the word algebra, and his own name gave us the word algorithm, a step-by-step recipe for solving problems, which computers use today. He also helped spread the numbers we use, 0 to 9, which came from India.","Which word comes from Al-Khwarizmi's name?","algorithm","alphabet","astronaut","Every app on a tablet runs on algorithms!"],
  pl:['Al-Chwarizmi','ok. 780–850','matematyk',"Al-Chwarizmi pracował w Domu Mądrości w Bagdadzie. Od tytułu jego książki pochodzi słowo algebra, a od jego imienia słowo algorytm, czyli przepis krok po kroku na rozwiązanie problemu, z którego korzystają dziś komputery. Pomógł też rozpowszechnić cyfry od 0 do 9, które przyszły z Indii.","Które słowo pochodzi od imienia Al-Chwarizmiego?","algorytm","alfabet","astronauta","Każda aplikacja na tablecie działa dzięki algorytmom!"]},
 {id:'ibnsina',era:'middle',e:'📗',p:['m','#C68E62','#2E2A2A','short','#F2D6A2','turban','beard'],
  en:['Ibn Sina','980–1037','doctor and philosopher',"Ibn Sina, also called Avicenna, was already working as a doctor when he was a teenager. He wrote a huge book called The Canon of Medicine, which universities used to teach doctors for about 600 years.","How long was Ibn Sina's Canon of Medicine used to teach doctors?","about 600 years","one week","it was never used","That's longer than almost any other science book!"],
  pl:['Ibn Sina','980–1037','lekarz i filozof',"Ibn Sina, zwany też Awicenną, pracował jako lekarz już jako nastolatek. Napisał ogromną książkę, Kanon medycyny, na której uniwersytety uczyły lekarzy przez około 600 lat.","Jak długo na Kanonie medycyny Ibn Siny uczono lekarzy?","około 600 lat","tydzień","nigdy go nie używano","To dłużej niż prawie każda inna książka naukowa!"]},
 {id:'hildegard',era:'middle',e:'🎶',p:['f','#F6D3B8','#6B4A2E','long','#3E3A5A','veil',''],
  en:['Hildegard of Bingen','1098–1179','composer and writer',"Hildegard was a nun in Germany who wrote beautiful music, which people still sing today. She also wrote books about plants, animals and healing. She's one of the earliest composers whose name we know.","Besides music, what did Hildegard write about?","plants and healing","rockets","computers","She studied nature and medicine as well as music."],
  pl:['Hildegarda z Bingen','1098–1179','kompozytorka i pisarka',"Hildegarda była zakonnicą w Niemczech i komponowała piękną muzykę, którą śpiewa się do dziś. Pisała też książki o roślinach, zwierzętach i leczeniu. To jedna z najwcześniejszych kompozytorek, których imię znamy.","O czym pisała Hildegarda oprócz muzyki?","o roślinach i leczeniu","o rakietach","o komputerach","Badała przyrodę i medycynę, a nie tylko muzykę."]},
 {id:'leonardo',era:'ren',e:'🖼️',p:['m','#F2C7A6','#B8B8B8','long','#B04A4A','beret','beard'],
  en:['Leonardo da Vinci','1452–1519','painter and inventor',"Leonardo painted the Mona Lisa, one of the most famous paintings in the world. He also drew the human body in amazing detail, studied how the heart works, and designed flying machines. He wrote his notes backwards, in mirror writing!","How did Leonardo write in his notebooks?","in mirror writing","in emojis","in comics","You can read his notes by holding them up to a mirror."],
  pl:['Leonardo da Vinci','1452–1519','malarz i wynalazca',"Leonardo namalował Mona Lisę, jeden z najsłynniejszych obrazów świata. Rysował też ludzkie ciało w niesamowitych szczegółach, badał, jak działa serce, i projektował maszyny latające. Notatki pisał od tyłu, pismem lustrzanym!","Jak Leonardo pisał w swoich notesach?","pismem lustrzanym","emotkami","komiksami","Jego notatki można przeczytać, przykładając je do lustra."]},
 {id:'copernicus',era:'ren',e:'☀️',p:['m','#F6D3B8','#4A3426','bob','#7A2E3A','',''],
  en:['Nicolaus Copernicus','1473–1543','astronomer',"Copernicus was born in Toruń, in Poland. Most people then believed the Sun travelled around the Earth, but Copernicus worked out that the Earth and the other planets travel around the Sun. His book was published in 1543.","Copernicus showed that the Earth travels around...","the Sun","the Moon","Mars","It's called the heliocentric model: helios is Greek for Sun."],
  pl:['Mikołaj Kopernik','1473–1543','astronom',"Kopernik urodził się w Toruniu. Większość ludzi wierzyła wtedy, że to Słońce krąży wokół Ziemi, ale Kopernik wyliczył, że Ziemia i inne planety krążą wokół Słońca. Jego książka ukazała się w 1543 roku.","Kopernik wykazał, że Ziemia krąży wokół...","Słońca","Księżyca","Marsa","To model heliocentryczny: helios po grecku znaczy Słońce."]},
 {id:'vesalius',era:'ren',e:'🦴',sys:'bones',p:['m','#F2C7A6','#2E2A2A','short','#2E3A5A','','beard'],
  en:['Andreas Vesalius','1514–1564','anatomist',"Vesalius looked inside the human body himself, instead of only trusting old books. In 1543 he published a giant book with incredibly detailed drawings of bones and muscles, and it corrected many old mistakes. It's the start of modern anatomy, just like the body you built!","What was Vesalius's famous book about?","the human body","the stars","cooking","His drawings of skeletons are still admired today."],
  pl:['Andreas Wesaliusz','1514–1564','anatom',"Wesaliusz sam zaglądał do wnętrza ludzkiego ciała, zamiast tylko wierzyć starym książkom. W 1543 roku wydał ogromną księgę z niezwykle dokładnymi rysunkami kości i mięśni, która poprawiła wiele dawnych błędów. To początek nowoczesnej anatomii, tak jak ciało, które budujemy!","O czym była słynna księga Wesaliusza?","o ludzkim ciele","o gwiazdach","o gotowaniu","Jego rysunki szkieletów podziwia się do dziś."]},
 {id:'shakespeare',era:'ren',e:'🎭',p:['m','#F6D3B8','#6B4A2E','bald','#3A2E2E','','beard'],
  en:['William Shakespeare','1564–1616','playwright and poet',"Shakespeare wrote about forty plays, including Romeo and Juliet and A Midsummer Night's Dream, and they're still performed all over the world. He's also the first known writer to use many English words, like eyeball and bedroom!","What did Shakespeare mostly write?","plays for the theatre","cookbooks","maps","His plays were performed at the Globe Theatre in London."],
  pl:['William Szekspir','1564–1616','dramatopisarz i poeta',"Szekspir napisał około czterdziestu sztuk, między innymi Romea i Julię oraz Sen nocy letniej, i wystawia się je na całym świecie. Jako pierwszy znany pisarz użył też wielu angielskich słów!","Co głównie pisał Szekspir?","sztuki teatralne","książki kucharskie","mapy","Jego sztuki grano w teatrze Globe w Londynie."]},
 {id:'galileo',era:'sci',e:'🔭',p:['m','#F2C7A6','#8A6A4A','short','#4A3A5A','','beard'],
  en:['Galileo Galilei','1564–1642','astronomer and physicist',"Galileo built better telescopes and pointed them at the sky. In 1610 he discovered four moons going around Jupiter, and saw mountains and craters on our Moon. He also did experiments with falling and rolling balls.","What did Galileo discover going around Jupiter?","four moons","a giant cloud of cats","a ring of ice cream","Those four big moons are still called the Galilean moons."],
  pl:['Galileusz','1564–1642','astronom i fizyk',"Galileusz budował lepsze lunety i kierował je w niebo. W 1610 roku odkrył cztery księżyce krążące wokół Jowisza i zobaczył góry i kratery na naszym Księżycu. Robił też doświadczenia ze spadającymi i toczącymi się kulami.","Co Galileusz odkrył wokół Jowisza?","cztery księżyce","chmurę kotów","pierścień z lodów","Te cztery duże księżyce do dziś nazywa się galileuszowymi."]},
 {id:'harvey',era:'sci',e:'❤️',sys:'blood',p:['m','#F6D3B8','#3A2E2A','long','#2E2E3A','','beard'],
  en:['William Harvey','1578–1657','doctor',"William Harvey discovered that the heart pumps blood around the body in a big circle, again and again. He called it circulation and published it in 1628. Before that, people thought the body used up blood and kept making new blood from food.","What did William Harvey discover?","blood travels round the body in a circle","the heart is made of gold","blood is blue","Circulation means the same blood goes round and round."],
  pl:['William Harvey','1578–1657','lekarz',"William Harvey odkrył, że serce pompuje krew po całym ciele w wielkim kole, w kółko i w kółko. Nazwał to krążeniem i opisał w 1628 roku. Wcześniej ludzie myśleli, że ciało zużywa krew i ciągle robi nową z jedzenia.","Co odkrył William Harvey?","że krew krąży po ciele w kole","że serce jest ze złota","że krew jest niebieska","Krążenie oznacza, że ta sama krew płynie w kółko."]},
 {id:'leeuwenhoek',era:'sci',e:'🔬',p:['m','#F2C7A6','#D8D0C0','long','#3A3A3A','',''],
  en:['Antonie van Leeuwenhoek','1632–1723','microscope maker',"Leeuwenhoek sold cloth in the Netherlands, but he made tiny, super-strong lenses as a hobby. Looking through them, he became the first person to see bacteria, and he also saw red blood cells and tiny creatures swimming in pond water.","What did Leeuwenhoek find in scrapings from his teeth?","tiny living bacteria","gold dust","sand","He called them animalcules, which means tiny animals."],
  pl:['Antoni van Leeuwenhoek','1632–1723','twórca mikroskopów',"Leeuwenhoek sprzedawał tkaniny w Holandii, ale z zamiłowania szlifował malutkie, bardzo mocne soczewki. Patrząc przez nie, jako pierwszy człowiek zobaczył bakterie, a także czerwone krwinki i maleńkie stworzenia pływające w wodzie ze stawu.","Co Leeuwenhoek znalazł w osadzie ze swoich zębów?","malutkie żywe bakterie","złoty pył","piasek","Nazywał je zwierzątkami, czyli animalkulami."]},
 {id:'newton',era:'sci',e:'🍎',p:['m','#F6D3B8','#E8E0D0','long','#5A2E3A','',''],
  en:['Isaac Newton','1643–1727','physicist and mathematician',"Newton explained gravity, the force that makes apples fall and keeps the Moon going around the Earth. He wrote the laws of motion, and with a glass prism he showed that white light is made of all the colours of the rainbow.","Newton showed that white light is made of...","all the colours of the rainbow","only blue","tiny bubbles","A prism splits white light into a rainbow."],
  pl:['Izaak Newton','1643–1727','fizyk i matematyk',"Newton wyjaśnił grawitację, siłę, która sprawia, że jabłka spadają, a Księżyc krąży wokół Ziemi. Opisał zasady ruchu, a szklanym pryzmatem pokazał, że białe światło składa się ze wszystkich kolorów tęczy.","Newton pokazał, że białe światło składa się...","ze wszystkich kolorów tęczy","tylko z niebieskiego","z malutkich bąbelków","Pryzmat rozszczepia białe światło na tęczę."]},
 {id:'mozart',era:'enl',e:'🎹',p:['m','#F6D3B8','#F2F2F2','wig','#C8486A','',''],
  en:['Wolfgang Amadeus Mozart','1756–1791','composer',"Mozart composed his first little pieces when he was about five years old, and toured Europe as a child musician. He wrote over 600 works, including operas and symphonies. He even wrote twelve variations on the tune we know as Twinkle, Twinkle, Little Star!","How old was Mozart when he composed his first pieces?","about five","about fifty","a hundred","You can play Twinkle, Twinkle in the music corner at home!"],
  pl:['Wolfgang Amadeusz Mozart','1756–1791','kompozytor',"Mozart skomponował pierwsze utworki, mając około pięciu lat, a jako dziecko koncertował po całej Europie. Napisał ponad 600 dzieł, w tym opery i symfonie. Skomponował nawet dwanaście wariacji na melodię, którą znamy jako Błyszcz, gwiazdko!","Ile lat miał Mozart, kiedy skomponował pierwsze utwory?","około pięciu","około pięćdziesięciu","sto","Tę melodię możesz zagrać w kąciku muzycznym w domku!"]},
 {id:'galvani',era:'enl',e:'⚡',sys:'muscles',p:['m','#F2C7A6','#E8E0D0','wig','#2E4A6A','',''],
  en:['Luigi Galvani','1737–1798','doctor and physicist',"Galvani noticed that a frog's leg muscles twitched when they were touched with metal and electricity. He realised that nerves and muscles work using tiny electrical signals. That's exactly how your brain tells your muscles to move!","What makes muscles move, according to Galvani's discovery?","tiny electrical signals from nerves","magic","music","Your nerves send electrical messages to your muscles all the time."],
  pl:['Luigi Galvani','1737–1798','lekarz i fizyk',"Galvani zauważył, że mięśnie żabiej nogi drgają, kiedy dotyka się ich metalem i prądem. Zrozumiał, że nerwy i mięśnie działają dzięki malutkim sygnałom elektrycznym. Właśnie tak mózg mówi mięśniom, żeby się poruszyły!","Co porusza mięśniami według odkrycia Galvaniego?","malutkie sygnały elektryczne z nerwów","magia","muzyka","Nerwy cały czas wysyłają do mięśni elektryczne wiadomości."]},
 {id:'lavoisier',era:'enl',e:'🫧',sys:'breath',p:['m','#F6D3B8','#E8E0D0','wig','#3A5A4A','',''],
  en:['Antoine Lavoisier','1743–1794','chemist',"Lavoisier named oxygen and hydrogen. He showed that breathing is a bit like very slow burning: our body uses oxygen from the air and breathes out carbon dioxide. He is called the father of modern chemistry.","Which element did Lavoisier name?","oxygen","gold","iron","Oxygen is the gas your lungs take from the air."],
  pl:['Antoine Lavoisier','1743–1794','chemik',"Lavoisier nadał nazwy tlenowi i wodorowi. Pokazał, że oddychanie jest trochę jak bardzo powolne spalanie: ciało zużywa tlen z powietrza i wydycha dwutlenek węgla. Nazywa się go ojcem współczesnej chemii.","Któremu pierwiastkowi Lavoisier nadał nazwę?","tlenowi","złotu","żelazu","Tlen to gaz, który płuca biorą z powietrza."]},
 {id:'jenner',era:'enl',e:'💉',p:['m','#F6D3B8','#E8E0D0','wig','#4A3A6A','',''],
  en:['Edward Jenner','1749–1823','doctor',"Jenner noticed that milkmaids who caught a mild illness from cows, called cowpox, didn't catch the dangerous disease smallpox. In 1796 he made the first vaccine. The word vaccine comes from vacca, the Latin word for cow!","The word vaccine comes from the Latin word for...","cow","needle","doctor","Vaccines have saved millions and millions of lives."],
  pl:['Edward Jenner','1749–1823','lekarz',"Jenner zauważył, że dojarki, które złapały od krów łagodną chorobę, krowiankę, nie chorowały na groźną ospę prawdziwą. W 1796 roku zrobił pierwszą szczepionkę. Słowo wakcyna pochodzi od łacińskiego vacca, czyli krowa!","Słowo wakcyna, czyli szczepionka, pochodzi od łacińskiego słowa...","krowa","igła","lekarz","Szczepionki uratowały miliony istnień."]},
 {id:'lovelace',era:'c19',e:'💻',p:['f','#F6D3B8','#3A2A2A','bun','#6A4A8A','',''],
  en:['Ada Lovelace','1815–1852','mathematician',"Ada Lovelace worked with Charles Babbage on his design for a mechanical computer. She wrote the first published computer program, a list of steps for the machine, and imagined that computers might one day make music too.","Ada Lovelace is often called the first...","computer programmer","pilot","astronaut","She saw the future of computers about a hundred years early!"],
  pl:['Ada Lovelace','1815–1852','matematyczka',"Ada Lovelace pracowała z Charlesem Babbage'em nad projektem mechanicznego komputera. Napisała pierwszy opublikowany program komputerowy, czyli listę kroków dla maszyny, i wyobrażała sobie, że komputery kiedyś będą też tworzyć muzykę.","Adę Lovelace często nazywa się pierwszą...","programistką","pilotką","astronautką","Przewidziała przyszłość komputerów o jakieś sto lat wcześniej!"]},
 {id:'chopin',era:'c19',e:'🎹',p:['m','#F6D3B8','#6B4A2E','short','#2E2E3A','',''],
  en:['Fryderyk Chopin','1810–1849','composer and pianist',"Chopin was born in Żelazowa Wola, near Warsaw, and gave his first public concert when he was just seven. He wrote dreamy nocturnes and lively mazurkas and polonaises, dances from Poland. Almost all his music is for one instrument.","Which instrument did Chopin write almost all his music for?","the piano","the drums","the trumpet","He's called the poet of the piano."],
  pl:['Fryderyk Chopin','1810–1849','kompozytor i pianista',"Chopin urodził się w Żelazowej Woli koło Warszawy, a pierwszy publiczny koncert dał w wieku zaledwie siedmiu lat. Pisał rozmarzone nokturny oraz żywe mazurki i polonezy, czyli polskie tańce. Prawie cała jego muzyka jest na jeden instrument.","Na jaki instrument Chopin pisał prawie całą muzykę?","na fortepian","na perkusję","na trąbkę","Nazywa się go poetą fortepianu."]},
 {id:'darwin',era:'c19',e:'🐢',sys:'coat',p:['m','#F6D3B8','#EDEDED','bald','#4A3A2E','','beard'],
  en:['Charles Darwin','1809–1882','naturalist',"Darwin sailed around the world on a ship called the Beagle. On the Galápagos Islands he noticed that finches had differently shaped beaks for different foods. In 1859 he explained evolution: living things slowly change over many generations to fit where they live, like fur, feathers and scales!","What did Darwin notice about the finches on the Galápagos Islands?","different beaks for different foods","they wore hats","they could talk","Fur, feathers and scales are all adaptations too."],
  pl:['Karol Darwin','1809–1882','przyrodnik',"Darwin opłynął świat statkiem Beagle. Na wyspach Galapagos zauważył, że zięby mają różnie ukształtowane dzioby do różnego jedzenia. W 1859 roku wyjaśnił ewolucję: żywe istoty powoli zmieniają się przez wiele pokoleń, żeby pasować do miejsca, w którym żyją, jak futro, pióra i łuski!","Co Darwin zauważył u zięb na Galapagos?","różne dzioby do różnego jedzenia","nosiły kapelusze","umiały mówić","Futro, pióra i łuski to też przystosowania."]},
 {id:'pasteur',era:'c19',e:'🦠',p:['m','#F6D3B8','#4A3A2E','short','#2E2E3A','','beard'],
  en:['Louis Pasteur','1822–1895','chemist and biologist',"Pasteur proved that tiny germs make food go bad and cause many diseases. He found that heating milk gently kills harmful germs, which we call pasteurisation, and he made a vaccine against rabies in 1885.","Heating milk to kill germs is called...","pasteurisation","freezing","evolution","Next time you see milk, look for the word pasteurised!"],

function eraDone(id){const fs=FIG.filter(f=>f.era===id);return fs.every(f=>S.met&&S.met[f.id]);}
function eraOpen(i){return i===0||eraDone(ERAS[i-1].id)||(S.met&&FIG.some(f=>f.era===ERAS[i].id&&S.met[f.id]));}
let curEra=0;
function travel(i,then){
  const ov=$('warp');const er=ERAS[i];ov.style.setProperty('--wc',er.bg);ov.classList.add('on');
  ov.querySelector('.wtxt').textContent=er[VOICE_LANG][1];
  try{ov.querySelector('.clock').animate([{transform:'rotate(0) scale(.6)'},{transform:'rotate(1080deg) scale(1.2)'}],{duration:1400,easing:'cubic-bezier(.4,0,.2,1)'});}catch(e){}
  setTimeout(()=>{ov.classList.remove('on');then&&then();},1450);
}
function openTime(focusFig){
  show('time');S.met=S.met||{};
  const first=ERAS.findIndex((e,i)=>eraOpen(i)&&!eraDone(e.id));curEra=focusFig?ERAS.findIndex(e=>e.id===FIG.find(f=>f.id===focusFig).era):(first<0?ERAS.length-1:first);
  drawTimeline();drawEra(false);
  if(focusFig){travel(curEra,()=>{drawEra(true);meet(focusFig);});}
  else say(TR(`This is the time machine! Each dot on the timeline is a time in history. Tap an era to travel there, meet famous people, and answer their questions to unlock the next era.`,`To wehikuł czasu! Każdy punkt na osi czasu to inna epoka. Dotknij epoki, żeby się tam przenieść, poznać słynne osoby i odpowiedzieć na ich pytania. Tak odblokujesz kolejną epokę.`));
}
function drawTimeline(){
  $('tline').innerHTML=ERAS.map((e,i)=>{const op=eraOpen(i),dn=eraDone(e.id);const t=e[VOICE_LANG];
    return `<button class="tnode ${op?'':'lock'} ${dn?'done':''} ${i===curEra?'cur':''}" data-i="${i}"><span class="tdot">${op?e.e:'🔒'}</span><b>${t[1]}</b><small>${t[0]}</small></button>`;}).join('');
  $('tline').querySelectorAll('.tnode').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
    if(!eraOpen(i)){say(TR('This era is still locked. Finish the era before it to travel here!','Ta epoka jest jeszcze zamknięta. Ukończ poprzednią epokę, żeby się tu przenieść!'));try{b.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:350});}catch(e){}return;}
    curEra=i;drawTimeline();travel(i,()=>drawEra(true));});
  const c=$('tline').querySelector('.cur');if(c)c.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  const n=Object.keys(S.met||{}).length;$('tcount').textContent=`🎟️ ${n} / ${FIG.length}`;
}
