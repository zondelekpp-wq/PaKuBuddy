const ORDER=['human','bunny','chick','bee','fish'];
const SYS=['bones','muscles','blood','breath','nerves','tummy','coat'];
const ZORDER=['bones','muscles','breath','tummy','blood','nerves'];

let RC=0;
function render(id,built,o={}){
  const c=C[id],Lk=o.look||{},F=o.outfit||{},A=ANC[id];
  const coat=Lk.coat?[Lk.coat,darken(Lk.coat,0.8)]:c.coat;
  let s=`<svg viewBox="0 0 300 340" xmlns="http://www.w3.org/2000/svg"><defs>
   <clipPath id="cBee"><ellipse cx="150" cy="256" rx="54" ry="62"/></clipPath>
   <clipPath id="cFish"><ellipse cx="146" cy="180" rx="100" ry="60"/></clipPath>
   ${A.top?`<clipPath id="cTop">${A.top.clip}</clipPath>`:''}
   <pattern id="scales" width="16" height="12" patternUnits="userSpaceOnUse"><path d="M0 12 Q8 0 16 12" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.6"/></pattern>
   <pattern id="pdots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="2.6" fill="#fff" fill-opacity=".8"/><circle cx="11" cy="11" r="2.6" fill="#fff" fill-opacity=".8"/></pattern>
   <pattern id="pstripes" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="12" fill="#fff" fill-opacity=".6"/></pattern>
   <pattern id="phearts" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M10 15 C2 10 4 4 10 7 C16 4 18 10 10 15Z" fill="#fff" fill-opacity=".8"/></pattern>
   <clipPath id="cSil">${c.sil}</clipPath>
   <radialGradient id="gShade" gradientUnits="userSpaceOnUse" cx="120" cy="105" r="240"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#3A2E4F" stop-opacity=".22"/></radialGradient>
   <pattern id="pstars" width="20" height="20" patternUnits="userSpaceOnUse"><polygon points="${starPts(10,10,6)}" fill="#fff" fill-opacity=".85"/></pattern></defs><ellipse class="shadow" cx="150" cy="328" rx="78" ry="8" fill="#4A3B66" opacity=".13"/><g class="bodyg">`;
  const dressed=built.coat;
  if(dressed&&F.back) s+=at(A.back,BACK[F.back.id].d(F.back.c,F.back.p));
  if(id==='human'&&dressed) s+=hairDraw(Lk,'back');
  if(!built.coat) s+=`<g fill="#ffffff" stroke="#C9B6F0" stroke-width="7" stroke-dasharray="9 8" stroke-linecap="round">${c.sil}</g><g fill="#ffffff" fill-opacity=".9">${c.sil}</g>`;
  for(const k of ZORDER){
    if(!built[k])continue;
    let layer='';
    if(k==='blood'){
      if(id==='bee') layer=el(150,256,50,58,'#B7E07A','opacity=".3"')+paths(['M150 306 L150 112'],'#9BCB55',7)+[262,240,218].map(y=>`<circle cx="150" cy="${y}" r="6" fill="#9BCB55"/>`).join('');
      else layer=paths(c.vessels,V,2.5,'transform="translate(4 3)"')+paths(c.vessels,R,3)+heart(...c.heartAt);
    } else if(k==='nerves'){
      layer=paths(c.nerves,N,2.6)+(c.ganglia?c.ganglia.map(y=>`<circle cx="150" cy="${y}" r="6" fill="${N}"/>`).join(''):'')+
        (c.lateral?paths(['M104 186 Q170 176 232 186'],'#FFE27A',3,'stroke-dasharray="2 6"'):'')+c.brain;
    } else layer=c[k];
    s+=`<g class="${o.pop===k?'pop':''}">${layer}</g>`;
  }
  if(built.coat){
    s+=`<g class="${o.pop==='coat'?'pop':''}" opacity="${o.xray?0.28:1}"><g fill="${coat[1]}" stroke="${coat[1]}" stroke-width="7" stroke-linejoin="round">${c.sil}</g><g fill="${coat[0]}">${c.sil}</g><rect x="0" y="0" width="300" height="340" fill="url(#gShade)" clip-path="url(#cSil)"/>${c.coatExtra.replace(/COAT0/g,coat[0]).replace(/COAT1/g,coat[1])}</g>`;
  }
  if(dressed&&!o.xray){
    if(F.top&&A.top) s+=topWear(F.top,A.top);
    if(F.shoes) s+=A.feet.map(f=>at([f[0],f[1],f[2]*(f[0]<150?-1:1),0,f[2]],SHOES[F.shoes.id].d(F.shoes.c,F.shoes.p))).join('');
    if(id==='human') s+=hairDraw(Lk,'front');
    if(F.neck) s+=at(A.neck,NECK[F.neck.id].d(F.neck.c,F.neck.p));
  }
  if(c.mouth)s+=`<ellipse class="mouthO" cx="${c.mouth[0]}" cy="${c.mouth[1]}" rx="${c.mouth[2]}" ry="${c.mouth[3]}" fill="#7A2E52"/>`;
  s+=c.face+(o.gender==='girl'?c.eyes.map(([x,y,k])=>lash(x,y,k,id==='fish'?-1:(x<150?-1:1))).join(''):'');
  if(dressed&&!o.xray){
    if(F.glasses) s+=GLASSES[F.glasses.id].d(F.glasses.c,c.eyes);
    if(F.hat){const H=HATS[F.hat.id],a=A.hat;s+=`<g transform="translate(${a[0]} ${a[1]+H.sink*a[2]}) rotate(${a[3]}) scale(${a[2]})">${H.d(F.hat.c,F.hat.p)}</g>`;}
    if(F.hand) s+=at(A.hand,HOLD[F.hand.id].d(F.hand.c,F.hand.p));
  }
  if(o.mood&&built.coat&&!o.xray){
    if(o.mood==='sleepy') s+=c.eyes.map(([x,y,k])=>`<path d="M${x-10*k} ${y} Q${x} ${y-16*k} ${x+10*k} ${y} Q${x} ${y-3*k} ${x-10*k} ${y}Z" fill="${coat[0]}"/><path d="M${x-9*k} ${y-1} Q${x} ${y+3*k} ${x+9*k} ${y-1}" stroke="${INK}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`).join('');
    if(o.mood==='sad') s+=c.eyes.map(([x,y,k])=>{const d=x<150||c.eyes.length===1?1:-1;return `<path d="M${x-8*d*k} ${y-13*k} L${x+7*d*k} ${y-17*k}" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/>`}).join('');
    if(o.mood==='happy') s+=c.eyes.map(([x,y,k])=>`<g class="twinkle"><path d="M${x+11*k} ${y-14*k} l2 -5 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2Z" fill="#FFD43B"/></g>`).join('');
  }
  s+=`</g></svg>`;
  const u='u'+(++RC);
  return s.replace(/cBee|cFish|scales|cTop|cSil|gShade|pdots|pstripes|phearts|pstars/g,m=>m+u);
}

bones:{t:'Bones',ic:'🦴',give:'bones',
 short:"Bones are the body's frame, like the poles inside a tent. They hold you up, and they keep the soft parts safe. Your skull is like a helmet for your brain!",
 more:"Bones are alive, and they grow as you grow! Where two bones meet, there's a joint, like a hinge on a door, so you can bend your knees and elbows. Inside some bones is soft bone marrow, which makes new blood every single day.",
 wow:"A grown-up has 206 bones, but a baby has about 300! Some of them join together as the baby grows. The smallest bone is deep inside your ear. It's called the stirrup, and it's smaller than a grain of rice!"},
muscles:{t:'Muscles',ic:'💪',give:'muscles',
 short:"Muscles make you move! They pull on your bones, like strings on a puppet. Every jump, every wave, and every smile uses muscles.",
 more:"Muscles can only pull, they can never push. So they work in pairs, like a team. One muscle pulls your arm up, and another one pulls it back down. When you run and play, your muscles get stronger.",
 wow:"You have more than 600 muscles! Your heart is a muscle too, and it never ever takes a break. And when you smile, you use about 12 muscles in your face."},
blood:{t:'Heart & blood',ic:'❤️',give:'a heart',
 short:"The heart is a pump. It pushes blood all around the body, like a delivery truck carrying food and air to every tiny part of you.",
 more:"The red tubes are called arteries. They carry blood away from the heart, full of fresh air. The blue ones are veins, and they bring the blood back home. Put your hand on your chest. That thump-thump is your heart pumping!",
 wow:"Your heart beats about one hundred thousand times every day! Blood is red because of a special ingredient called haemoglobin, which carries oxygen. If you laid all your blood tubes in a line, they would go around the whole Earth twice!"},
breath:{t:'Lungs',ic:'🌬️',give:'lungs',
 short:"Lungs are like two balloons in your chest. When you breathe in, they fill up with air. Your body takes oxygen out of the air. Oxygen is like fuel for every part of you!",
 more:"Air goes in through your nose, down a tube called the windpipe, and into your lungs. Tiny bubbles deep inside pass the oxygen into your blood. When you breathe out, you let go of a gas your body doesn't need, called carbon dioxide. And guess what? Plants love it!",
 wow:"Inside your lungs there are about 500 million teeny tiny air bubbles, called alveoli. If you spread them all out flat, they would cover a whole tennis court!"},
nerves:{t:'Brain & nerves',ic:'🧠',give:'a brain',
 short:"The brain is the boss of the body! It thinks, remembers, and dreams. It sends messages everywhere through nerves, like telephone wires.",
 more:"Your senses send messages to your brain. Eyes for seeing, ears for hearing, nose for smelling, tongue for tasting, and skin for touching. The brain decides what to do, and sends a message back, super fast!",
 wow:"Nerve messages can zoom faster than a racing car! Your brain has about 86 billion nerve cells, called neurons. And while you sleep, your brain tidies up everything you learned today, like putting toys back on the shelf."},
tummy:{t:'Tummy',ic:'🍎',give:'a tummy',
 short:"The tummy turns food into energy! Food goes on a long journey: the mouth, then a tube to the stomach, then the intestines, like a long, wiggly slide.",
 more:"Teeth chop the food, and spit makes it soft. The stomach squishes it with special juices. In the intestines, the good bits go into the blood, and the leftovers come out as poo when you go to the toilet. Everybody poos!",
 wow:"Your intestines are so long that, if you stretched them out, they would be longer than a bus! Trillions of tiny friendly helpers, called gut bacteria, live in there and help digest your food."}
};

function vScore(v){
  const n=(v.name+' '+(v.voiceURI||'')).toLowerCase(),L=(v.lang||'').toLowerCase().replace('_','-');let s=0;
  if(/bad news|bahh|bells|boing|bubbles|cellos|jester|organ|trinoids|whisper|zarvox|albert|\bfred\b|junior|ralph|superstar|wobble|good news|grandma|grandpa|rocko|shelley|sandy|\breed\b|\beddy\b|\bflo\b/.test(n))return -999;
  if(VOICE_LANG==='en'){
    if(L==='en-gb')s+=50;else if(L.startsWith('en'))s+=5;else return -500;
    if(/serena|kate|martha|stephanie|libby|sonia|maisie|hazel|bella|emma|amy|olivia|female|gba|gbc|gbg/.test(n))s+=25;
    if(/daniel|arthur|oliver|george|ryan|thomas|(^|[^e])male|gbb|gbd|rjs/.test(n))s-=40;
  } else {
    if(L.startsWith('pl'))s+=50;else return -500;
    if(/zosia|paulina|ewa|agnieszka|zofia|maja|female|pla|plb|ple/.test(n))s+=25;
    if(/krzysztof|jacek|marek|(^|[^e])male|pld/.test(n))s-=40;
  }
  if(/premium/.test(n))s+=40;if(/enhanced|rozszerzon|wysok/.test(n))s+=30;if(/natural|neural|wavenet|studio/.test(n))s+=35;
  if(/google/.test(n))s+=8;if(v.localService)s+=3;
  return s;
}
function voiceList(){if(!('speechSynthesis' in window))return[];return speechSynthesis.getVoices().map(v=>({v,s:vScore(v)})).filter(x=>x.s>-100).sort((a,b)=>b.s-a.s).map(x=>x.v);}
function pickVoice(){const vs=voiceList();let saved=null;try{saved=localStorage.getItem('buddyVoice_'+VOICE_LANG);}catch(e){}
  voice=(saved&&vs.find(v=>v.voiceURI===saved))||vs[0]||null;const st=document.getElementById('settings');if(st&&st.classList.contains('on'))drawVoices();}
let rate=1;try{rate=+localStorage.getItem('buddyRate')||1;}catch(e){}

function caption(parts,i,el){
  if(el){el.innerHTML=parts.map((p,j)=>`<span class="${j===i?'now':''}">${p}</span>`).join(' ');const n=el.querySelector('.now');if(n)n.scrollIntoView({block:'nearest'});return;}
  const sc=document.querySelector('.screen.on [data-cap]');if(!sc)return;
  sc.innerHTML=`<span class="who">${S.name?S.name+' mówi':'Przewodnik mówi'}</span>`+parts.map((p,j)=>`<span class="${j===i?'now':''}">${p}</span>`).join(' ');
}
function talking(on){['av','av2','av3','av4'].forEach(x=>{const a=document.getElementById(x);if(a)a.classList.toggle('talk',on);});}
function say(text,then,el){
  const my=++tok;
  const parts=(text.match(/[^.!?]+[.!?]+["”'’]?|[^.!?]+$/g)||[text]).map(s=>s.trim()).filter(Boolean);
  caption(parts,-1,el);
  const finish=()=>{if(my!==tok)return;tok++;const t2=tok;talking(false);caption(parts,-1,el);if(then)setTimeout(()=>{if(t2===tok)then()},450);};
  if(muted||!('speechSynthesis' in window)){talking(false);if(then)setTimeout(()=>{if(my===tok)then()},1200);return;}
  try{speechSynthesis.cancel();}catch(e){}
  /* group sentences into smooth chunks: fewer breaks, more natural flow */
  const groups=[];let cur=[],len=0;
  parts.forEach((p,i)=>{if(cur.length&&len+p.length>220){groups.push(cur);cur=[];len=0;}cur.push(i);len+=p.length+1;});
  if(cur.length)groups.push(cur);
  let left=groups.length;talking(true);
  setTimeout(()=>{
    if(my!==tok)return;
    groups.forEach(g=>{
      const txt=g.map(i=>parts[i]).join(' ');
      const u=new SpeechSynthesisUtterance(txt);
      u.lang=VOICE_LANG==='en'?'en-GB':'pl-PL';if(voice){u.voice=voice;u.lang=voice.lang;}
      u.rate=(slow?0.82:0.97)*rate;u.pitch=1.0;u.volume=1;
      const starts=[];let pos=0;g.forEach(i=>{starts.push(pos);pos+=parts[i].length+1;});
      u.onstart=()=>{if(my===tok)caption(parts,g[0],el);};
      u.onboundary=e=>{if(my!==tok||e.charIndex==null)return;let k=0;for(let j=0;j<starts.length;j++)if(e.charIndex>=starts[j])k=j;caption(parts,g[k],el);};
      const fin=()=>{if(my!==tok)return;if(--left<=0)finish();};
      u.onend=fin;u.onerror=fin;
      speechSynthesis.speak(u);
    });
    /* watchdog: if the device never starts speaking, keep the app moving */
    setTimeout(()=>{if(my===tok&&!speechSynthesis.speaking&&!speechSynthesis.pending)finish();},2500);
  },70);
}

function darken(hex,f=0.8){const n=parseInt(hex.slice(1),16);const r=Math.round((n>>16&255)*f),g=Math.round((n>>8&255)*f),b=Math.round((n&255)*f);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}

function flower(x,y,c,r=6){let s='';for(let i=0;i<5;i++){const a=i*Math.PI*2/5;s+=`<circle cx="${(x+Math.cos(a)*r*1.1).toFixed(1)}" cy="${(y+Math.sin(a)*r*1.1).toFixed(1)}" r="${r}" fill="${c}" stroke="${darken(c,0.85)}" stroke-width="1"/>`;}return s+`<circle cx="${x}" cy="${y}" r="${r*0.7}" fill="#FFE066"/>`;}

function hairDraw(Lk,part){
  const st=Lk.hair||'short',c=Lk.hairColor||'#9A6A48',d=darken(c,0.82);
  const g=sh=>`<g fill="${c}" stroke="${d}" stroke-width="2" stroke-linejoin="round">${sh}</g>`;
  const fringe='<path d="M90 92 Q88 28 150 28 Q212 28 210 92 Q196 58 150 60 Q104 58 90 92Z"/>';
  if(part==='back'){
    if(st==='long') return g('<rect x="84" y="62" width="132" height="146" rx="40"/>');
    if(st==='pigtails') return g('<ellipse cx="78" cy="120" rx="18" ry="32"/><ellipse cx="222" cy="120" rx="18" ry="32"/>');
    return '';
  }
  if(st==='none') return '';
  if(st==='bob') return g('<path d="M86 122 Q78 28 150 28 Q222 28 214 122 L198 122 Q198 64 150 62 Q102 64 102 122Z"/>');
  if(st==='curly'){let s='';for(let i=0;i<=8;i++){const a=Math.PI*(1.08+i*0.105);s+=`<circle cx="${(150+60*Math.cos(a)).toFixed(1)}" cy="${(90+60*Math.sin(a)).toFixed(1)}" r="17"/>`;}return g(s);}
  let s=g(fringe);
  if(st==='bun') s=g('<circle cx="150" cy="24" r="20"/>')+s;
  if(st==='pigtails') s+='<circle cx="94" cy="96" r="7" fill="#FF8FB8"/><circle cx="206" cy="96" r="7" fill="#FF8FB8"/>';
  return s;
}

const WHY={

const CHEERS=()=>[`Ale słodko!`,`Ooo, jak elegancko!`,`Podoba mi się!`,`Idealnie!`,`Super styl!`,`Wow, pięknie!`];
function pickItem(id){
  if(tab==='hair'){S.look.hair=id;save();drawDress();say(`${HAIR[id].n}! ${rnd(CHEERS())}`);return;}
  if(id==='none'){delete S.outfit[tab];save();drawDress();say(`Bez tego. Dobrze!`);return;}
  const prev=S.outfit[tab]||{};
  S.outfit[tab]={id,c:prev.c||rnd(PAL)[0],p:prev.p||'plain'};stat('outfits');save();drawDress();
  const nm=CATS[tab][id].n;say(`${nm[0].toUpperCase()+nm.slice(1)}! ${rnd(CHEERS())}`);
}
function pickColour(c){
  const pal=tab==='body'?COATS[S.creature]:tab==='hair'?HAIRC:PAL,name=(pal.find(x=>x[0]===c)||[0,''])[1];

  else if(S.outfit[tab])S.outfit[tab].c=c;else{say('Najpierw coś wybierz, a potem kolor!');return;}

}
function pickPat(p){

/* ---------- jobs screen ---------- */
let tmpJ=null;
function jobOf(){return (JOBS[S.creature]||[]).find(j=>j.id===S.job);}
function openJobs(){
  show('jobs');tmpJ=null;$('pickJ').classList.add('hidden');
  $('jobGrid').innerHTML=JOBS[S.creature].map(j=>`<button class="job ${j.id===S.job?'sel':''}" data-j="${j.id}"><span class="je">${j.e}</span>${j.n}</button>`).join('');
  $('jobGrid').querySelectorAll('.job').forEach(bt=>bt.onclick=()=>{
    tmpJ=bt.dataset.j;$('jobGrid').querySelectorAll('.job').forEach(x=>x.classList.toggle('sel',x===bt));
    $('pickJ').classList.remove('hidden');
    const j=JOBS[S.creature].find(x=>x.id===tmpJ);
    say(`${j.n}! ${j.d}`,()=>say(`Chcesz wybrać tę pracę? Dotknij: ta praca!`));
  });
  const extra=S.creature==='human'?'':` Zwierzęta też pracują! Pomagają przyrodzie i ludziom.`;
  say(`Jaką pracę wybierzemy?${extra} Dotknij obrazka, żeby posłuchać o każdej pracy.`);
}
$('pickJ').onclick=()=>{if(!tmpJ)return;S.job=tmpJ;S.day=S.day||0;save();openWork();};
$('backJ').onclick=()=>openBuild(true);

/* ---------- work day ---------- */
let W=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const k=Math.floor(Math.random()*(i+1));[a[i],a[k]]=[a[k],a[i]];}return a;}
function openWork(){
  const j=jobOf();if(!j){openJobs();return;}
  show('work');
  const skip=(S.day||0)%j.sc.length;
  W={j,list:shuffle(j.sc.filter((_,i)=>i!==skip)),i:-1,earned:0};
  $('avp3').style.background=j.bg;
  $('scene').innerHTML=j.deco.map((e,i)=>`<span style="left:${[6,78,12,82,45][i]}%;top:${[8,12,70,66,4][i]}%">${e}</span>`).join('');
  $('avName3').textContent=S.name;$('badge').textContent=j.e;
  $('av3').innerHTML=render(S.creature,S.built,OPT());$('av3').classList.add('walkin');setTimeout(()=>$('av3').classList.remove('walkin'),1300);
  updWorkTop();
  $('choices').innerHTML='';$('nextQ').classList.add('hidden');$('goHome').classList.add('hidden');
  say(`Dzień dobry! To ${(S.day||0)+1}. dzień w pracy. ${S.name} idzie do pracy. Dziś pracujemy ${j.place}! Zobaczmy, co się wydarzy.`,()=>nextScene());
}
function updWorkTop(){
  $('workTitle').innerHTML=`Dzień ${(S.day||0)+1}: <span>${W.j.n}</span>`;$('workTitle').innerHTML+=` <small class="rank">${rankName(W.j.id)}</small>`;
  $('stars').textContent='⭐ '+(S.stars||0);
  $('dots').innerHTML=W.list.map((_,i)=>`<span class="${i<W.i?'done':i===W.i?'now':''}"></span>`).join('');
}
function sceneSpeech(s,opts){return s.q+' '+opts.map((o,i)=>(i?'Czy: ':'')+o[1]+'?').join(' ');}
function nextScene(){
  W.i++;$('nextQ').classList.add('hidden');
  if(W.i>=W.list.length){endDay();return;}
  const s=W.list[W.i],opts=shuffle(s.a);W.opts=opts;W.tries=0;updWorkTop();
  $('qcard').innerHTML=`<span class="qn">Zadanie ${W.i+1} z ${W.list.length}</span>${s.q}`;
  $('choices').innerHTML=opts.map((o,k)=>`<div class="ch" data-k="${k}"><button class="chb" data-k="${k}"><span class="ce">${o[0]}</span><span>${o[1]}</span></button><button class="hear" data-h="${k}" aria-label="Hear this">🔊</button></div>`).join('');
  $('choices').querySelectorAll('.chb').forEach(bt=>bt.onclick=()=>choose(+bt.dataset.k));
  $('choices').querySelectorAll('.hear').forEach(bt=>bt.onclick=()=>say(opts[+bt.dataset.h][1]));
  say(sceneSpeech(s,opts));
}
function choose(k){
  const o=W.opts[k],row=$('choices').querySelector(`.ch[data-k="${k}"]`);
  if(row.classList.contains('no'))return;
  if(o[2]){
    row.classList.add('yes');$('choices').querySelectorAll('.chb').forEach(x=>x.onclick=null);
    S.stars=(S.stars||0)+1;W.earned++;gain(10);save();updWorkTop();sparkle3();
    say(`${rnd(['Świetny wybór!','Tak, brawo!','Doskonale!','Super!'])} ${o[3]}`,()=>{$('nextQ').classList.remove('hidden');say(W.i+1<W.list.length?'Dotknij: dalej, następne zadanie!':'Dotknij: dalej, żeby skończyć pracę!');});
    $('nextQ').classList.add('hidden');
  } else {
    row.classList.add('no');W.tries++;
    say(`Hmm, pomyślmy. ${o[3]} Spróbujmy jeszcze raz!`);
  }
}
$('nextQ').onclick=nextScene;
function endDay(){
  S.day=(S.day||0)+1;jobDayDone();save();
  $('qcard').innerHTML=`<span class="qn">Gotowe!</span>🎉 Koniec pracy!`;$('choices').innerHTML='';
  $('goHome').classList.remove('hidden');sparkle3();setTimeout(sparkle3,500);
  const P_=P();
  say(`Hurra! Koniec pracy na dziś! ${S.name} ${G('zdobył','zdobyła')} gwiazdki: ${W.earned}, a wszystkich gwiazdek jest już ${S.stars}. ${S.name} ${G('ciężko pracował','ciężko pracowała')}, więc teraz trzeba wrócić do domu, zjeść i odpocząć. Dotknij domku!`);
}
function sparkle3(){const p=$('avp3');for(let i=0;i<12;i++){const s=document.createElement('span');s.className='spark';s.textContent=['⭐','✨','💖','🌟','💫'][i%5];
  s.style.left=(15+Math.random()*70)+'%';s.style.top=(25+Math.random()*55)+'%';s.style.animationDelay=(Math.random()*.4)+'s';p.appendChild(s);setTimeout(()=>s.remove(),1900);}}
$('goHome').onclick=()=>openHome(true);
$('backW').onclick=()=>openBuild(true);
$('changeJob').onclick=openJobs;
$('av3').onclick=()=>say(rnd(GIGGLE));
function goWork(){if(!S.job)openJobs();else openWork();}

$('toWork').onclick=goWork;

let AC=null,playing=null,MASTER=null;
function freq(n){const m=n.match(/^([A-G])(#?)(\d)$/);const k={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]?1:0);return 440*Math.pow(2,(k+12*(+m[3]+1)-69)/12);}
function impulse(sec,decay){const r=AC.sampleRate,l=Math.floor(r*sec),b=AC.createBuffer(2,l,r);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<l;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/l,decay);}return b;}
function ensureAC(){try{

    MASTER=AC.createGain();MASTER.gain.value=0.85;
    const dry=AC.createGain();dry.gain.value=0.78;const wet=AC.createGain();wet.gain.value=0.32;
    const rev=AC.createConvolver();rev.buffer=impulse(2.6,2.8);
    const warm=AC.createBiquadFilter();warm.type='lowshelf';warm.frequency.value=300;warm.gain.value=3;
    MASTER.connect(dry);MASTER.connect(rev);rev.connect(wet);dry.connect(warm);wet.connect(warm);warm.connect(comp);comp.connect(AC.destination);}
  if(AC.state==='suspended')AC.resume();return true;}catch(e){return false;}}

function pianoNote(f,t,d,vel=0.55){

function harmonise(notes,key,win,total){

  const xp=S.xp||0,l=lvlOf(xp),lo=l>1?needXP(l-1):0,hi=needXP(l),pc=Math.max(0,Math.min(1,(xp-lo)/(hi-lo)));
  document.querySelectorAll('.lvl').forEach(c=>{c.innerHTML=`<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="#EEE6FF" stroke-width="5"/><circle cx="20" cy="20" r="16" fill="none" stroke="#B197FC" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(pc*100.5).toFixed(1)} 200" transform="rotate(-90 20 20)"/></svg><b>${l}</b>`;
    if(bump)try{c.animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:500,easing:SPRING});}catch(e){}});
}
document.querySelectorAll('#build .top,#dress .top,#work .top,#home .top').forEach(t=>{const sp=t.querySelector('.sp');const c=document.createElement('button');c.className='lvl';c.setAttribute('aria-label','Level');t.insertBefore(c,sp.nextSibling);c.onclick=openTrophies;});
function openTrophies(){
  S.stats=S.stats||{};const xp=S.xp||0,l=lvlOf(xp),t=TITLES[VOICE_LANG][Math.min(l-1,8)];
  $('tbox').innerHTML=`<h3>🏆 ${TR('Trophy room','Sala trofeów')}</h3>
   <div class="lvlbig"><div class="lvl">${''}</div><div><b>${TR('Level','Poziom')} ${l}: ${t}</b><br><small>${xp} / ${needXP(l)} XP</small></div></div>
   <div class="setl">${TR('Badges','Odznaki')}</div>
   <div class="bdgs">${BADGES.map(([id,e,en,pl])=>`<div class="bdg ${S.badges&&S.badges[id]?'got':''}"><span>${e}</span>${TR(en,pl)}</div>`).join('')}</div>
   <div class="setl">${TR('Stats','Statystyki')}</div>
   <div class="stats"><span>⭐ ${S.stars||0}</span><span>💼 ${S.day||0} ${TR('days','dni')}</span><span>🧠 ${S.stats.quiz||0}</span><span>📚 ${S.stats.stories||0}</span><span>🎵 ${S.stats.songs||0}</span><span>💖 ${S.stats.care||0}</span></div>
   <button class="bigbtn lil" id="tClose">${TR('Close','Zamknij')}</button>`;
  $('trophies').classList.add('on');paintLvl();stag($('tbox').querySelectorAll('.bdg'),100);
  $('tClose').onclick=()=>$('trophies').classList.remove('on');
  say(TR(`Level ${l}! You're a ${t}. You have ${Object.keys(S.badges||{}).length} badges. Keep exploring to earn more!`,`Poziom ${l}! Tytuł: ${t}. Masz odznaki: ${Object.keys(S.badges||{}).length}. Odkrywaj dalej, żeby zdobyć więcej!`));
}

const SCI={
 bones:{en:"Science level! Your skeleton has two main parts. The axial skeleton is the skull, spine and ribs. The appendicular skeleton is your arms, legs, shoulders and hips. The spine is a stack of small bones called vertebrae, with soft discs between them as shock absorbers. The longest bone is the femur, in your thigh. Bones store calcium, and the red marrow inside makes about two million new red blood cells every second!",
  pl:"Poziom naukowy! Szkielet ma dwie główne części. Szkielet osiowy to czaszka, kręgosłup i żebra. Szkielet kończyn to ręce, nogi, obręcz barkowa i miednica. Kręgosłup to stos małych kości, zwanych kręgami, a między nimi są miękkie krążki, które amortyzują wstrząsy. Najdłuższa kość to kość udowa. Kości magazynują wapń, a czerwony szpik w środku robi około dwóch milionów nowych czerwonych krwinek na sekundę!"},
 muscles:{en:"There are three kinds of muscle. Skeletal muscles move your bones, and you control them. Smooth muscles squeeze food along your intestines without you thinking about it. Cardiac muscle is found only in the heart. Skeletal muscles are joined to bones by tough cords called tendons. Your biceps bends your arm and your triceps straightens it. A pair like this, pulling in opposite directions, is called antagonistic muscles.",
  pl:"Są trzy rodzaje mięśni. Mięśnie szkieletowe poruszają kośćmi i to ty nimi sterujesz. Mięśnie gładkie przesuwają jedzenie w jelitach, bez twojego myślenia. Mięsień sercowy jest tylko w sercu. Mięśnie szkieletowe łączą się z kośćmi mocnymi sznurami, zwanymi ścięgnami. Biceps zgina rękę, a triceps ją prostuje. Taka para, która ciągnie w przeciwne strony, to mięśnie antagonistyczne."},
 blood:{en:"The heart has four rooms, called chambers: two atria on top and two ventricles below. The right side pumps blood to the lungs to collect oxygen, and the left side pumps it around the whole body. Blood contains red blood cells that carry oxygen, white blood cells that fight germs, and platelets that plug cuts. The tiniest vessels, capillaries, are so narrow that blood cells squeeze through them one at a time!",
  pl:"Serce ma cztery komory: dwa przedsionki na górze i dwie komory na dole. Prawa strona pompuje krew do płuc po tlen, a lewa wysyła ją do całego ciała. We krwi są czerwone krwinki, które niosą tlen, białe krwinki, które walczą z zarazkami, i płytki krwi, które zatykają skaleczenia. Najmniejsze naczynia, naczynia włosowate, są tak wąskie, że krwinki przeciskają się przez nie pojedynczo!"},
 breath:{en:"Air travels down your trachea, which splits into two bronchi, then into thousands of tiny bronchioles, ending in the alveoli. Each alveolus is wrapped in capillaries, so oxygen passes into the blood and carbon dioxide passes out. This swap is called gas exchange. A dome-shaped muscle under your lungs, the diaphragm, pulls down to suck air in. Hiccups happen when the diaphragm twitches!",
  pl:"Powietrze płynie tchawicą, która dzieli się na dwa oskrzela, potem na tysiące oskrzelików, aż do pęcherzyków płucnych. Każdy pęcherzyk oplatają naczynia włosowate, więc tlen przechodzi do krwi, a dwutlenek węgla wychodzi. Ta wymiana to wymiana gazowa. Mięsień w kształcie kopuły pod płucami, przepona, ciągnie w dół i wciąga powietrze. Czkawka to drganie przepony!"},
 nerves:{en:"Your brain has parts with different jobs. The cerebrum, the biggest part, thinks, remembers and controls movement. The cerebellum at the back keeps you balanced. The brainstem runs automatic jobs like breathing and heartbeat. Messages travel along neurons as tiny electrical signals. If you touch something hot, your spinal cord makes you pull away before your brain even notices. That's a reflex!",
  pl:"Mózg ma części z różnymi zadaniami. Kresomózgowie, największa część, myśli, pamięta i steruje ruchem. Móżdżek z tyłu dba o równowagę. Pień mózgu prowadzi automatyczne zadania, jak oddychanie i bicie serca. Wiadomości płyną neuronami jako malutkie sygnały elektryczne. Kiedy dotkniesz czegoś gorącego, rdzeń kręgowy cofa rękę, zanim mózg w ogóle to zauważy. To odruch!"},
 tummy:{en:"Digestion starts in the mouth, where enzymes in saliva begin breaking food down. Food travels down the oesophagus, pushed by waves of muscle called peristalsis, so you could even swallow upside down! The stomach uses acid. The liver makes bile to break up fat. The small intestine is lined with millions of finger-like villi that soak up nutrients, and the large intestine takes back water. What's left becomes poo.",
  pl:"Trawienie zaczyna się w buzi, gdzie enzymy w ślinie zaczynają rozkładać jedzenie. Jedzenie płynie przełykiem, pchane falami mięśni, czyli perystaltyką, więc dałoby się połykać nawet do góry nogami! Żołądek używa kwasu. Wątroba robi żółć, która rozbija tłuszcz. Jelito cienkie ma miliony malutkich palczastych kosmków, które wchłaniają składniki odżywcze, a jelito grube odzyskuje wodę. Reszta to kupa."},
 coat:{en:"Skin has three layers: the thin epidermis on top, the dermis below with nerves, blood vessels, sweat glands and hair roots, and a fatty layer underneath that keeps you warm. Melanin in the epidermis gives skin its colour and protects against the sun's ultraviolet light. You shed about thirty thousand dead skin cells every minute!",
  pl:"Skóra ma trzy warstwy: cienki naskórek na wierzchu, pod nim skórę właściwą z nerwami, naczyniami krwionośnymi, gruczołami potowymi i korzeniami włosów, a na dole warstwę tłuszczu, która grzeje. Melanina w naskórku daje skórze kolor i chroni przed promieniami ultrafioletowymi. Co minutę gubisz około trzydziestu tysięcy martwych komórek skóry!"}};
const FUR={en:"Each hair grows from a pocket in the skin called a follicle. Mammals can make their fur stand up to trap more warm air. People do it too, and that's what makes goosebumps! Many animals have two layers: a soft undercoat for warmth and longer guard hairs that keep out water.",
  pl:"Każdy włos rośnie z kieszonki w skórze, zwanej mieszkiem włosowym. Ssaki potrafią zjeżyć futro, żeby zatrzymać więcej ciepłego powietrza. Ludzie też to robią i tak powstaje gęsia skórka! Wiele zwierząt ma dwie warstwy: miękki podszerstek, który grzeje, i dłuższe włosy okrywowe, które chronią przed wodą."};

  coat:{en:"A feather has a central shaft with branches called barbs. The barbs have tiny hooks called barbules that zip together like Velcro, making a smooth surface for flying. When birds preen, they zip their barbs back together. Down feathers have no hooks, so they stay fluffy and trap warm air.",pl:"Pióro ma środkową stosinę z gałązkami, zwanymi promieniami. Promienie mają malutkie haczyki, promyki, które zapinają się jak rzep i tworzą gładką powierzchnię do latania. Kiedy ptak czyści pióra, zapina je z powrotem. Puch nie ma haczyków, więc jest puszysty i zatrzymuje ciepło."}},
 bee:{bones:{en:"The exoskeleton is made of chitin and protein, layered like plywood for strength, with a waxy coating that makes it waterproof. Its joints have thin, bendy membranes, a bit like a knight's armour. Insects are arthropods, which means jointed legs, just like spiders and crabs.",pl:"Szkielet zewnętrzny jest zbudowany z chityny i białka, ułożonych warstwami jak sklejka, z woskową powłoką, dzięki której nie przemaka. W stawach ma cienkie, giętkie błony, trochę jak zbroja rycerza. Owady to stawonogi, czyli zwierzęta z członowanymi nogami, tak jak pająki i kraby."},

  breath:{en:"Air enters through spiracles, small holes along the thorax and abdomen that can open and close. The tracheae branch into tiny tracheoles that deliver oxygen straight to the cells. Bees pump their abdomen to push air in and out, and they also have air sacs that help when flying.",pl:"Powietrze wpada przez przetchlinki, małe otworki na tułowiu i odwłoku, które mogą się otwierać i zamykać. Tchawki rozgałęziają się na malutkie tchawki końcowe, które dostarczają tlen prosto do komórek. Pszczoły pompują odwłokiem powietrze, a w czasie lotu pomagają im worki powietrzne."},
  nerves:{en:"An insect's nervous system has a brain and a ventral nerve cord running along the belly, with clumps of nerve cells called ganglia in each body segment. A bee's brain has about one million neurons. Bees can learn shapes and colours, and experiments suggest they even understand the idea of zero!",pl:"Układ nerwowy owada to mózg i brzuszny łańcuch nerwowy biegnący wzdłuż brzucha, z węzłami nerwowymi, zwojami, w każdym segmencie ciała. Mózg pszczoły ma około miliona neuronów. Pszczoły uczą się kształtów i kolorów, a doświadczenia sugerują, że rozumieją nawet pojęcie zera!"},

function quizFor(k){const o=QZ_OV[S.creature]&&QZ_OV[S.creature][k];return o||QZ[k];}
let QS=null;
function openQuiz(k){QS={k,list:quizFor(k),i:0,ok:0};$('quiz').classList.add('on');quizStep();}
function quizStep(){
  if(QS.i>=QS.list.length){const all=QS.ok===QS.list.length;
    $('qbox').innerHTML=`<div class="qhead">🧠 ${TR('Quiz','Quiz')}</div><div class="qres">${all?'🏆':'⭐'} ${QS.ok} / ${QS.list.length}</div><button class="bigbtn" id="qDone">${TR('Done','Gotowe')}</button>`;
    if(all)confetti($('qbox'),60);$('qDone').onclick=()=>$('quiz').classList.remove('on');
    say(all?TR('Perfect score! You really know your stuff!','Wszystko dobrze! Naprawdę dużo wiesz!'):TR(`You got ${QS.ok} out of ${QS.list.length}. Great try! You can play again any time.`,`Dobre odpowiedzi: ${QS.ok} z ${QS.list.length}. Super próba! Możesz zagrać jeszcze raz.`));return;}
  const d=QS.list[QS.i][VOICE_LANG],ans=shuffle([1,2,3]);
  $('qbox').innerHTML=`<div class="qhead">🧠 ${TR('Quiz','Quiz')} · ${QS.i+1}/${QS.list.length}</div><div class="qq">${d[0]}</div>`+
    ans.map(a=>`<button class="qa" data-a="${a}">${d[a]}</button>`).join('')+`<div class="qx" id="qx"></div>`;
  stag($('qbox').querySelectorAll('.qa'),80);
  let tried=false;
  $('qbox').querySelectorAll('.qa').forEach(b=>b.onclick=()=>{
    if(b.classList.contains('no')||$('qbox').querySelector('.qa.yes'))return;
    if(+b.dataset.a===1){b.classList.add('yes');if(!tried){QS.ok++;stat('quiz');gain(15);}confetti(b,30);
      $('qx').textContent=d[4];say(TR('Correct! ','Dobrze! ')+d[4],()=>{QS.i++;quizStep();});}
    else{tried=true;b.classList.add('no');try{b.animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],{duration:350});}catch(e){}
      say(TR('Not quite. Try again!','Jeszcze nie. Spróbuj ponownie!'));}
  });
  say(d[0]+' '+ans.map(a=>d[a]).join(TR('? Or ','? Czy ')).replace(/^/, '')+'?');
}

  pl:['Hypatia','ok. 360–415','matematyczka i astronomka',"Hypatia była jedną z najsłynniejszych nauczycielek w Aleksandrii, w Egipcie. Uczyła matematyki, astronomii i filozofii, i pisała o geometrii. Uczniowie przyjeżdżali z daleka, żeby się od niej uczyć.","W którym mieście uczyła Hypatia?","w Aleksandrii","w Londynie","w Paryżu","Aleksandria miała jedną z największych bibliotek starożytnego świata."]},
 {id:'khwarizmi',era:'middle',e:'➗',p:['m','#C68E62','#1E1A1A','short','#BFE3D6','turban','beard'],
  en:['Al-Khwarizmi','c. 780–850','mathematician',"Al-Khwarizmi worked at the House of Wisdom in Baghdad. His book gave us the word algebra, and his own name gave us the word algorithm, a step-by-step recipe for solving problems, which computers use today. He also helped spread the numbers we use, 0 to 9, which came from India.","Which word comes from Al-Khwarizmi's name?","algorithm","alphabet","astronaut","Every app on a tablet runs on algorithms!"],
  pl:['Al-Chwarizmi','ok. 780–850','matematyk',"Al-Chwarizmi pracował w Domu Mądrości w Bagdadzie. Od tytułu jego książki pochodzi słowo algebra, a od jego imienia słowo algorytm, czyli przepis krok po kroku na rozwiązanie problemu, z którego korzystają dziś komputery. Pomógł też rozpowszechnić cyfry od 0 do 9, które przyszły z Indii.","Które słowo pochodzi od imienia Al-Chwarizmiego?","algorytm","alfabet","astronauta","Każda aplikacja na tablecie działa dzięki algorytmom!"]},
 {id:'ibnsina',era:'middle',e:'📗',p:['m','#C68E62','#2E2A2A','short','#F2D6A2','turban','beard'],
  en:['Ibn Sina','980–1037','doctor and philosopher',"Ibn Sina, also called Avicenna, was already working as a doctor when he was a teenager. He wrote a huge book called The Canon of Medicine, which universities used to teach doctors for about 600 years.","How long was Ibn Sina's Canon of Medicine used to teach doctors?","about 600 years","one week","it was never used","That's longer than almost any other science book!"],
  pl:['Ibn Sina','980–1037','lekarz i filozof',"Ibn Sina, zwany też Awicenną, pracował jako lekarz już jako nastolatek. Napisał ogromną książkę, Kanon medycyny, na której uniwersytety uczyły lekarzy przez około 600 lat.","Jak długo na Kanonie medycyny Ibn Siny uczono lekarzy?","około 600 lat","tydzień","nigdy go nie używano","To dłużej niż prawie każda inna książka naukowa!"]},
 {id:'hildegard',era:'middle',e:'🎶',p:['f','#F6D3B8','#6B4A2E','long','#3E3A5A','veil',''],
  en:['Hildegard of Bingen','1098–1179','composer and writer',"Hildegard was a nun in Germany who wrote beautiful music, which people still sing today. She also wrote books about plants, animals and healing. She's one of the earliest composers whose name we know.","Besides music, what did Hildegard write about?","plants and healing","rockets","computers","She studied nature and medicine as well as music."],
  pl:['Hildegarda z Bingen','1098–1179','kompozytorka i pisarka',"Hildegarda była zakonnicą w Niemczech i komponowała piękną muzykę, którą śpiewa się do dziś. Pisała też książki o roślinach, zwierzętach i leczeniu. To jedna z najwcześniejszych kompozytorek, których imię znamy.","O czym pisała Hildegarda oprócz muzyki?","o roślinach i leczeniu","o rakietach","o komputerach","Badała przyrodę i medycynę, a nie tylko muzykę."]},
 {id:'leonardo',era:'ren',e:'🖼️',p:['m','#F2C7A6','#B8B8B8','long','#B04A4A','beret','beard'],
  en:['Leonardo da Vinci','1452–1519','painter and inventor',"Leonardo painted the Mona Lisa, one of the most famous paintings in the world. He also drew the human body in amazing detail, studied how the heart works, and designed flying machines. He wrote his notes backwards, in mirror writing!","How did Leonardo write in his notebooks?","in mirror writing","in emojis","in comics","You can read his notes by holding them up to a mirror."],
  pl:['Leonardo da Vinci','1452–1519','malarz i wynalazca',"Leonardo namalował Mona Lisę, jeden z najsłynniejszych obrazów świata. Rysował też ludzkie ciało w niesamowitych szczegółach, badał, jak działa serce, i projektował maszyny latające. Notatki pisał od tyłu, pismem lustrzanym!","Jak Leonardo pisał w swoich notesach?","pismem lustrzanym","emotkami","komiksami","Jego notatki można przeczytać, przykładając je do lustra."]},
 {id:'copernicus',era:'ren',e:'☀️',p:['m','#F6D3B8','#4A3426','bob','#7A2E3A','',''],
  en:['Nicolaus Copernicus','1473–1543','astronomer',"Copernicus was born in Toruń, in Poland. Most people then believed the Sun travelled around the Earth, but Copernicus worked out that the Earth and the other planets travel around the Sun. His book was published in 1543.","Copernicus showed that the Earth travels around...","the Sun","the Moon","Mars","It's called the heliocentric model: helios is Greek for Sun."],
  pl:['Mikołaj Kopernik','1473–1543','astronom',"Kopernik urodził się w Toruniu. Większość ludzi wierzyła wtedy, że to Słońce krąży wokół Ziemi, ale Kopernik wyliczył, że Ziemia i inne planety krążą wokół Słońca. Jego książka ukazała się w 1543 roku.","Kopernik wykazał, że Ziemia krąży wokół...","Słońca","Księżyca","Marsa","To model heliocentryczny: helios po grecku znaczy Słońce."]},
 {id:'vesalius',era:'ren',e:'🦴',sys:'bones',p:['m','#F2C7A6','#2E2A2A','short','#2E3A5A','','beard'],
  en:['Andreas Vesalius','1514–1564','anatomist',"Vesalius looked inside the human body himself, instead of only trusting old books. In 1543 he published a giant book with incredibly detailed drawings of bones and muscles, and it corrected many old mistakes. It's the start of modern anatomy, just like the body you built!","What was Vesalius's famous book about?","the human body","the stars","cooking","His drawings of skeletons are still admired today."],
  pl:['Andreas Wesaliusz','1514–1564','anatom',"Wesaliusz sam zaglądał do wnętrza ludzkiego ciała, zamiast tylko wierzyć starym książkom. W 1543 roku wydał ogromną księgę z niezwykle dokładnymi rysunkami kości i mięśni, która poprawiła wiele dawnych błędów. To początek nowoczesnej anatomii, tak jak ciało, które budujemy!","O czym była słynna księga Wesaliusza?","o ludzkim ciele","o gwiazdach","o gotowaniu","Jego rysunki szkieletów podziwia się do dziś."]},
 {id:'shakespeare',era:'ren',e:'🎭',p:['m','#F6D3B8','#6B4A2E','bald','#3A2E2E','','beard'],
  en:['William Shakespeare','1564–1616','playwright and poet',"Shakespeare wrote about forty plays, including Romeo and Juliet and A Midsummer Night's Dream, and they're still performed all over the world. He's also the first known writer to use many English words, like eyeball and bedroom!","What did Shakespeare mostly write?","plays for the theatre","cookbooks","maps","His plays were performed at the Globe Theatre in London."],
  pl:['William Szekspir','1564–1616','dramatopisarz i poeta',"Szekspir napisał około czterdziestu sztuk, między innymi Romea i Julię oraz Sen nocy letniej, i wystawia się je na całym świecie. Jako pierwszy znany pisarz użył też wielu angielskich słów!","Co głównie pisał Szekspir?","sztuki teatralne","książki kucharskie","mapy","Jego sztuki grano w teatrze Globe w Londynie."]},
 {id:'galileo',era:'sci',e:'🔭',p:['m','#F2C7A6','#8A6A4A','short','#4A3A5A','','beard'],
  en:['Galileo Galilei','1564–1642','astronomer and physicist',"Galileo built better telescopes and pointed them at the sky. In 1610 he discovered four moons going around Jupiter, and saw mountains and craters on our Moon. He also did experiments with falling and rolling balls.","What did Galileo discover going around Jupiter?","four moons","a giant cloud of cats","a ring of ice cream","Those four big moons are still called the Galilean moons."],
  pl:['Galileusz','1564–1642','astronom i fizyk',"Galileusz budował lepsze lunety i kierował je w niebo. W 1610 roku odkrył cztery księżyce krążące wokół Jowisza i zobaczył góry i kratery na naszym Księżycu. Robił też doświadczenia ze spadającymi i toczącymi się kulami.","Co Galileusz odkrył wokół Jowisza?","cztery księżyce","chmurę kotów","pierścień z lodów","Te cztery duże księżyce do dziś nazywa się galileuszowymi."]},
 {id:'harvey',era:'sci',e:'❤️',sys:'blood',p:['m','#F6D3B8','#3A2E2A','long','#2E2E3A','','beard'],
  en:['William Harvey','1578–1657','doctor',"William Harvey discovered that the heart pumps blood around the body in a big circle, again and again. He called it circulation and published it in 1628. Before that, people thought the body used up blood and kept making new blood from food.","What did William Harvey discover?","blood travels round the body in a circle","the heart is made of gold","blood is blue","Circulation means the same blood goes round and round."],
  pl:['William Harvey','1578–1657','lekarz',"William Harvey odkrył, że serce pompuje krew po całym ciele w wielkim kole, w kółko i w kółko. Nazwał to krążeniem i opisał w 1628 roku. Wcześniej ludzie myśleli, że ciało zużywa krew i ciągle robi nową z jedzenia.","Co odkrył William Harvey?","że krew krąży po ciele w kole","że serce jest ze złota","że krew jest niebieska","Krążenie oznacza, że ta sama krew płynie w kółko."]},
 {id:'leeuwenhoek',era:'sci',e:'🔬',p:['m','#F2C7A6','#D8D0C0','long','#3A3A3A','',''],
  en:['Antonie van Leeuwenhoek','1632–1723','microscope maker',"Leeuwenhoek sold cloth in the Netherlands, but he made tiny, super-strong lenses as a hobby. Looking through them, he became the first person to see bacteria, and he also saw red blood cells and tiny creatures swimming in pond water.","What did Leeuwenhoek find in scrapings from his teeth?","tiny living bacteria","gold dust","sand","He called them animalcules, which means tiny animals."],
  pl:['Antoni van Leeuwenhoek','1632–1723','twórca mikroskopów',"Leeuwenhoek sprzedawał tkaniny w Holandii, ale z zamiłowania szlifował malutkie, bardzo mocne soczewki. Patrząc przez nie, jako pierwszy człowiek zobaczył bakterie, a także czerwone krwinki i maleńkie stworzenia pływające w wodzie ze stawu.","Co Leeuwenhoek znalazł w osadzie ze swoich zębów?","malutkie żywe bakterie","złoty pył","piasek","Nazywał je zwierzątkami, czyli animalkulami."]},
 {id:'newton',era:'sci',e:'🍎',p:['m','#F6D3B8','#E8E0D0','long','#5A2E3A','',''],
  en:['Isaac Newton','1643–1727','physicist and mathematician',"Newton explained gravity, the force that makes apples fall and keeps the Moon going around the Earth. He wrote the laws of motion, and with a glass prism he showed that white light is made of all the colours of the rainbow.","Newton showed that white light is made of...","all the colours of the rainbow","only blue","tiny bubbles","A prism splits white light into a rainbow."],
  pl:['Izaak Newton','1643–1727','fizyk i matematyk',"Newton wyjaśnił grawitację, siłę, która sprawia, że jabłka spadają, a Księżyc krąży wokół Ziemi. Opisał zasady ruchu, a szklanym pryzmatem pokazał, że białe światło składa się ze wszystkich kolorów tęczy.","Newton pokazał, że białe światło składa się...","ze wszystkich kolorów tęczy","tylko z niebieskiego","z malutkich bąbelków","Pryzmat rozszczepia białe światło na tęczę."]},
 {id:'mozart',era:'enl',e:'🎹',p:['m','#F6D3B8','#F2F2F2','wig','#C8486A','',''],
  en:['Wolfgang Amadeus Mozart','1756–1791','composer',"Mozart composed his first little pieces when he was about five years old, and toured Europe as a child musician. He wrote over 600 works, including operas and symphonies. He even wrote twelve variations on the tune we know as Twinkle, Twinkle, Little Star!","How old was Mozart when he composed his first pieces?","about five","about fifty","a hundred","You can play Twinkle, Twinkle in the music corner at home!"],
  pl:['Wolfgang Amadeusz Mozart','1756–1791','kompozytor',"Mozart skomponował pierwsze utworki, mając około pięciu lat, a jako dziecko koncertował po całej Europie. Napisał ponad 600 dzieł, w tym opery i symfonie. Skomponował nawet dwanaście wariacji na melodię, którą znamy jako Błyszcz, gwiazdko!","Ile lat miał Mozart, kiedy skomponował pierwsze utwory?","około pięciu","około pięćdziesięciu","sto","Tę melodię możesz zagrać w kąciku muzycznym w domku!"]},
 {id:'galvani',era:'enl',e:'⚡',sys:'muscles',p:['m','#F2C7A6','#E8E0D0','wig','#2E4A6A','',''],
  en:['Luigi Galvani','1737–1798','doctor and physicist',"Galvani noticed that a frog's leg muscles twitched when they were touched with metal and electricity. He realised that nerves and muscles work using tiny electrical signals. That's exactly how your brain tells your muscles to move!","What makes muscles move, according to Galvani's discovery?","tiny electrical signals from nerves","magic","music","Your nerves send electrical messages to your muscles all the time."],
  pl:['Luigi Galvani','1737–1798','lekarz i fizyk',"Galvani zauważył, że mięśnie żabiej nogi drgają, kiedy dotyka się ich metalem i prądem. Zrozumiał, że nerwy i mięśnie działają dzięki malutkim sygnałom elektrycznym. Właśnie tak mózg mówi mięśniom, żeby się poruszyły!","Co porusza mięśniami według odkrycia Galvaniego?","malutkie sygnały elektryczne z nerwów","magia","muzyka","Nerwy cały czas wysyłają do mięśni elektryczne wiadomości."]},
 {id:'lavoisier',era:'enl',e:'🫧',sys:'breath',p:['m','#F6D3B8','#E8E0D0','wig','#3A5A4A','',''],
  en:['Antoine Lavoisier','1743–1794','chemist',"Lavoisier named oxygen and hydrogen. He showed that breathing is a bit like very slow burning: our body uses oxygen from the air and breathes out carbon dioxide. He is called the father of modern chemistry.","Which element did Lavoisier name?","oxygen","gold","iron","Oxygen is the gas your lungs take from the air."],
  pl:['Antoine Lavoisier','1743–1794','chemik',"Lavoisier nadał nazwy tlenowi i wodorowi. Pokazał, że oddychanie jest trochę jak bardzo powolne spalanie: ciało zużywa tlen z powietrza i wydycha dwutlenek węgla. Nazywa się go ojcem współczesnej chemii.","Któremu pierwiastkowi Lavoisier nadał nazwę?","tlenowi","złotu","żelazu","Tlen to gaz, który płuca biorą z powietrza."]},
 {id:'jenner',era:'enl',e:'💉',p:['m','#F6D3B8','#E8E0D0','wig','#4A3A6A','',''],
  en:['Edward Jenner','1749–1823','doctor',"Jenner noticed that milkmaids who caught a mild illness from cows, called cowpox, didn't catch the dangerous disease smallpox. In 1796 he made the first vaccine. The word vaccine comes from vacca, the Latin word for cow!","The word vaccine comes from the Latin word for...","cow","needle","doctor","Vaccines have saved millions and millions of lives."],
  pl:['Edward Jenner','1749–1823','lekarz',"Jenner zauważył, że dojarki, które złapały od krów łagodną chorobę, krowiankę, nie chorowały na groźną ospę prawdziwą. W 1796 roku zrobił pierwszą szczepionkę. Słowo wakcyna pochodzi od łacińskiego vacca, czyli krowa!","Słowo wakcyna, czyli szczepionka, pochodzi od łacińskiego słowa...","krowa","igła","lekarz","Szczepionki uratowały miliony istnień."]},
 {id:'lovelace',era:'c19',e:'💻',p:['f','#F6D3B8','#3A2A2A','bun','#6A4A8A','',''],
  en:['Ada Lovelace','1815–1852','mathematician',"Ada Lovelace worked with Charles Babbage on his design for a mechanical computer. She wrote the first published computer program, a list of steps for the machine, and imagined that computers might one day make music too.","Ada Lovelace is often called the first...","computer programmer","pilot","astronaut","She saw the future of computers about a hundred years early!"],
  pl:['Ada Lovelace','1815–1852','matematyczka',"Ada Lovelace pracowała z Charlesem Babbage'em nad projektem mechanicznego komputera. Napisała pierwszy opublikowany program komputerowy, czyli listę kroków dla maszyny, i wyobrażała sobie, że komputery kiedyś będą też tworzyć muzykę.","Adę Lovelace często nazywa się pierwszą...","programistką","pilotką","astronautką","Przewidziała przyszłość komputerów o jakieś sto lat wcześniej!"]},
 {id:'chopin',era:'c19',e:'🎹',p:['m','#F6D3B8','#6B4A2E','short','#2E2E3A','',''],
  en:['Fryderyk Chopin','1810–1849','composer and pianist',"Chopin was born in Żelazowa Wola, near Warsaw, and gave his first public concert when he was just seven. He wrote dreamy nocturnes and lively mazurkas and polonaises, dances from Poland. Almost all his music is for one instrument.","Which instrument did Chopin write almost all his music for?","the piano","the drums","the trumpet","He's called the poet of the piano."],
  pl:['Fryderyk Chopin','1810–1849','kompozytor i pianista',"Chopin urodził się w Żelazowej Woli koło Warszawy, a pierwszy publiczny koncert dał w wieku zaledwie siedmiu lat. Pisał rozmarzone nokturny oraz żywe mazurki i polonezy, czyli polskie tańce. Prawie cała jego muzyka jest na jeden instrument.","Na jaki instrument Chopin pisał prawie całą muzykę?","na fortepian","na perkusję","na trąbkę","Nazywa się go poetą fortepianu."]},
 {id:'darwin',era:'c19',e:'🐢',sys:'coat',p:['m','#F6D3B8','#EDEDED','bald','#4A3A2E','','beard'],
  en:['Charles Darwin','1809–1882','naturalist',"Darwin sailed around the world on a ship called the Beagle. On the Galápagos Islands he noticed that finches had differently shaped beaks for different foods. In 1859 he explained evolution: living things slowly change over many generations to fit where they live, like fur, feathers and scales!","What did Darwin notice about the finches on the Galápagos Islands?","different beaks for different foods","they wore hats","they could talk","Fur, feathers and scales are all adaptations too."],
  pl:['Karol Darwin','1809–1882','przyrodnik',"Darwin opłynął świat statkiem Beagle. Na wyspach Galapagos zauważył, że zięby mają różnie ukształtowane dzioby do różnego jedzenia. W 1859 roku wyjaśnił ewolucję: żywe istoty powoli zmieniają się przez wiele pokoleń, żeby pasować do miejsca, w którym żyją, jak futro, pióra i łuski!","Co Darwin zauważył u zięb na Galapagos?","różne dzioby do różnego jedzenia","nosiły kapelusze","umiały mówić","Futro, pióra i łuski to też przystosowania."]},
 {id:'pasteur',era:'c19',e:'🦠',p:['m','#F6D3B8','#4A3A2E','short','#2E2E3A','','beard'],
  en:['Louis Pasteur','1822–1895','chemist and biologist',"Pasteur proved that tiny germs make food go bad and cause many diseases. He found that heating milk gently kills harmful germs, which we call pasteurisation, and he made a vaccine against rabies in 1885.","Heating milk to kill germs is called...","pasteurisation","freezing","evolution","Next time you see milk, look for the word pasteurised!"],
  pl:['Ludwik Pasteur','1822–1895','chemik i biolog',"Pasteur udowodnił, że malutkie zarazki psują jedzenie i wywołują wiele chorób. Odkrył, że delikatne podgrzanie mleka zabija groźne zarazki, co nazywamy pasteryzacją, a w 1885 roku zrobił szczepionkę przeciw wściekliźnie.","Podgrzewanie mleka, żeby zabić zarazki, to...","pasteryzacja","zamrażanie","ewolucja","Poszukaj na kartonie mleka słowa pasteryzowane!"]},
 {id:'vangogh',era:'c19',e:'🌻',p:['m','#F2C7A6','#D9743A','short','#3A6AA8','','beard'],
  en:['Vincent van Gogh','1853–1890','painter',"Van Gogh was a Dutch painter who used bright colours and thick, swirly brushstrokes. He painted sunflowers, starry skies and his bedroom. He sold very few paintings in his life, but today he's one of the most loved artists in the world.","Which famous van Gogh painting shows a swirling night sky?","The Starry Night","the Mona Lisa","a map of Mars","You can almost see the wind moving in his paintings."],
  pl:['Vincent van Gogh','1853–1890','malarz',"Van Gogh był holenderskim malarzem, który używał jaskrawych kolorów i grubych, zakręconych pociągnięć pędzla. Malował słoneczniki, gwiaździste niebo i swoją sypialnię. Za życia sprzedał bardzo niewiele obrazów, a dziś jest jednym z najbardziej kochanych artystów świata.","Który słynny obraz van Gogha przedstawia wirujące nocne niebo?","Gwiaździsta noc","Mona Lisa","mapa Marsa","Na jego obrazach prawie widać, jak porusza się wiatr."]},
 {id:'curie',era:'c20',e:'☢️',p:['f','#F6D3B8','#8A6A4A','bun','#2E2E3A','',''],
  en:['Marie Skłodowska-Curie','1867–1934','physicist and chemist',"Marie was born in Warsaw. She discovered two new elements, polonium and radium, and studied radioactivity. She was the first woman to win a Nobel Prize, and the first person ever to win Nobel Prizes in two different sciences, physics and chemistry.","Marie Curie named the element polonium after...","Poland","a pony","the North Pole","She named it after her homeland, Poland."],
  pl:['Maria Skłodowska-Curie','1867–1934','fizyczka i chemiczka',"Maria urodziła się w Warszawie. Odkryła dwa nowe pierwiastki, polon i rad, i badała promieniotwórczość. Jako pierwsza kobieta zdobyła Nagrodę Nobla i jako pierwsza osoba na świecie dostała Nagrody Nobla w dwóch różnych naukach: fizyce i chemii.","Na cześć czego Maria Skłodowska-Curie nazwała polon?","Polski","kucyka","bieguna północnego","Nazwała go na cześć swojej ojczyzny, Polski."]},
 {id:'pavlov',era:'c20',e:'🔔',sys:'tummy',p:['m','#F6D3B8','#EDEDED','bald','#3A3A3A','','beard'],
  en:['Ivan Pavlov','1849–1936','physiologist',"Pavlov won the Nobel Prize in 1904 for studying how digestion works, from saliva to the stomach. In his famous experiments, dogs learned that a certain sound meant food was coming, and they started to drool as soon as they heard it. That's called a conditioned reflex.","Pavlov's dogs learned to drool when they heard...","a signal that meant food was coming","a song they liked","thunder","Our bodies can learn to get ready for food, too!"],
  pl:['Iwan Pawłow','1849–1936','fizjolog',"Pawłow dostał Nagrodę Nobla w 1904 roku za badania nad trawieniem, od śliny po żołądek. W słynnych doświadczeniach psy uczyły się, że pewien dźwięk zapowiada jedzenie, i zaczynały się ślinić, gdy tylko go usłyszały. To się nazywa odruch warunkowy.","Psy Pawłowa uczyły się ślinić, kiedy słyszały...","sygnał, że zaraz będzie jedzenie","piosenkę, którą lubiły","grzmot","Nasze ciało też potrafi nauczyć się szykować na jedzenie!"]},

  s+=`<path d="M18 130 Q20 96 60 92 Q100 96 102 130Z" fill="${out}" stroke="${darken(out,0.8)}" stroke-width="2"/>`;
  if(ex==='')s+='';

  s+=`<circle cx="30" cy="58" r="7" fill="${skin}" stroke="${d}" stroke-width="2"/><circle cx="90" cy="58" r="7" fill="${skin}" stroke="${d}" stroke-width="2"/>`;

  if(ex==='beard')s+=`<path d="M34 60 Q36 92 60 94 Q84 92 86 60 Q74 74 60 74 Q46 74 34 60Z" fill="${hair}" stroke="${hd}" stroke-width="2"/>`;
  if(ex==='moustache')s+=`<path d="M48 68 Q54 62 60 66 Q66 62 72 68 Q66 70 60 68 Q54 70 48 68Z" fill="${hair}"/>`;
  s+=`<g class="eye"><ellipse cx="50" cy="56" rx="4" ry="5" fill="${INK}"/><circle cx="51.5" cy="54" r="1.5" fill="#fff"/></g><g class="eye"><ellipse cx="70" cy="56" rx="4" ry="5" fill="${INK}"/><circle cx="71.5" cy="54" r="1.5" fill="#fff"/></g>`;
  if(ex==='brows')s+=`<path d="M44 47 Q60 44 76 47" stroke="${INK}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  if(ex==='glasses')s+=`<circle cx="50" cy="56" r="8" fill="none" stroke="#5A4A7A" stroke-width="2.5"/><circle cx="70" cy="56" r="8" fill="none" stroke="#5A4A7A" stroke-width="2.5"/><path d="M58 56 L62 56" stroke="#5A4A7A" stroke-width="2.5"/>`;
  s+=`<ellipse cx="42" cy="66" rx="5" ry="3" fill="#FF9EB5" opacity=".7"/><ellipse cx="78" cy="66" rx="5" ry="3" fill="#FF9EB5" opacity=".7"/>`;

  const H=`fill="${hair}" stroke="${hd}" stroke-width="2"`;
  if(hat!=='nemes'&&hat!=='helmet'&&hat!=='veil'&&hat!=='turban'){
    if(st==='short'||st==='long'||st==='pony')s+=`<path d="M30 52 Q30 22 60 22 Q90 22 90 52 Q80 34 60 36 Q40 34 30 52Z" ${H}/>`;
    if(st==='bob')s+=`<path d="M28 66 Q24 22 60 22 Q96 22 92 66 L84 66 Q84 36 60 36 Q36 36 36 66Z" ${H}/>`;
    if(st==='bun')s+=`<circle cx="60" cy="20" r="11" ${H}/><path d="M30 52 Q30 24 60 24 Q90 24 90 52 Q80 36 60 38 Q40 36 30 52Z" ${H}/>`;
    if(st==='curly'){let c='';for(let i=0;i<=8;i++){const a=Math.PI*(1.05+i*0.11);c+=`<circle cx="${(60+31*Math.cos(a)).toFixed(1)}" cy="${(52+31*Math.sin(a)).toFixed(1)}" r="9"/>`;}s+=`<g ${H}>${c}</g>`;}
    if(st==='wig')s+=`<path d="M28 60 Q26 20 60 20 Q94 20 92 60 Q84 40 60 38 Q36 40 28 60Z" fill="#F4F4F4" stroke="#D0D0D0" stroke-width="2"/><circle cx="29" cy="62" r="7" fill="#F4F4F4" stroke="#D0D0D0" stroke-width="2"/><circle cx="91" cy="62" r="7" fill="#F4F4F4" stroke="#D0D0D0" stroke-width="2"/>`;

}
/* ---- state & screens ---- */
function eraDone(id){const fs=FIG.filter(f=>f.era===id);return fs.every(f=>S.met&&S.met[f.id]);}
function eraOpen(i){return i===0||eraDone(ERAS[i-1].id)||(S.met&&FIG.some(f=>f.era===ERAS[i].id&&S.met[f.id]));}
let curEra=0;
function travel(i,then){
  const ov=$('warp');const er=ERAS[i];ov.style.setProperty('--wc',er.bg);ov.classList.add('on');
  ov.querySelector('.wtxt').textContent=er[VOICE_LANG][1];
  try{ov.querySelector('.clock').animate([{transform:'rotate(0) scale(.6)'},{transform:'rotate(1080deg) scale(1.2)'}],{duration:1400,easing:'cubic-bezier(.4,0,.2,1)'});}catch(e){}
  setTimeout(()=>{ov.classList.remove('on');then&&then();},1450);
}
function openTime(focusFig){
  show('time');S.met=S.met||{};
  const first=ERAS.findIndex((e,i)=>eraOpen(i)&&!eraDone(e.id));curEra=focusFig?ERAS.findIndex(e=>e.id===FIG.find(f=>f.id===focusFig).era):(first<0?ERAS.length-1:first);
  drawTimeline();drawEra(false);
  if(focusFig){travel(curEra,()=>{drawEra(true);meet(focusFig);});}
  else say(TR(`This is the time machine! Each dot on the timeline is a time in history. Tap an era to travel there, meet famous people, and answer their questions to unlock the next era.`,`To wehikuł czasu! Każdy punkt na osi czasu to inna epoka. Dotknij epoki, żeby się tam przenieść, poznać słynne osoby i odpowiedzieć na ich pytania. Tak odblokujesz kolejną epokę.`));
}
function drawTimeline(){
  $('tline').innerHTML=ERAS.map((e,i)=>{const op=eraOpen(i),dn=eraDone(e.id);const t=e[VOICE_LANG];
    return `<button class="tnode ${op?'':'lock'} ${dn?'done':''} ${i===curEra?'cur':''}" data-i="${i}"><span class="tdot">${op?e.e:'🔒'}</span><b>${t[1]}</b><small>${t[0]}</small></button>`;}).join('');
  $('tline').querySelectorAll('.tnode').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
    if(!eraOpen(i)){say(TR('This era is still locked. Finish the era before it to travel here!','Ta epoka jest jeszcze zamknięta. Ukończ poprzednią epokę, żeby się tu przenieść!'));try{b.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:350});}catch(e){}return;}
    curEra=i;drawTimeline();travel(i,()=>drawEra(true));});
  const c=$('tline').querySelector('.cur');if(c)c.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  const n=Object.keys(S.met||{}).length;$('tcount').textContent=`🎟️ ${n} / ${FIG.length}`;
}
function drawEra(speak){
  const er=ERAS[curEra],t=er[VOICE_LANG];

 {e:'🐢',t:'Żółw i zając',src:'bajka Ezopa',p:["Dawno, dawno temu szybki zając śmiał się z powolnego żółwia. „Ale jesteś wolny!” – powiedział zając.","„Urządźmy wyścig” – odpowiedział spokojnie żółw. Wszystkie zwierzęta przyszły popatrzeć.","Start! Zając pomknął tak daleko, że żółw był za nim tylko małą kropką.","„Jestem tak daleko z przodu” – ziewnął zając. – „Utnę sobie drzemkę”. I zasnął pod drzewem.","A żółw szedł dalej. Krok, krok, krok. Powoli, ale ani na chwilę się nie zatrzymał.","Kiedy zając się obudził, pobiegł najszybciej, jak umiał. Ale żółw już przekraczał linię mety!","Morał: powoli i wytrwale wygrywa wyścig. Próbuj dalej i nie poddawaj się!"]},
 {e:'🦁',t:'Lew i mysz',src:'bajka Ezopa',p:["Wielki lew spał w słońcu, kiedy mała myszka przebiegła mu po nosie.","Lew się obudził i złapał myszkę ogromną łapą. „Puść mnie, proszę!” – pisnęła myszka. – „Kiedyś ja pomogę tobie”.","Lew się roześmiał. „Jak taka mała mysz może pomóc wielkiemu lwu?”. Ale był dobry i puścił myszkę.","Kilka dni później lew wpadł w sieć myśliwego. Ryczał i ryczał, ale nie mógł się wydostać.","Myszka go usłyszała. Przybiegła i gryzła sznurki ostrymi ząbkami, chrup, chrup, aż lew był wolny!","„Dziękuję, mała przyjaciółko” – powiedział lew. – „Miałaś rację. Nawet najmniejszy przyjaciel może bardzo pomóc”.","Morał: bądź dobry dla wszystkich. Mali przyjaciele potrafią wielkie rzeczy!"]},
 {e:'🐜',t:'Mrówka i konik polny',src:'bajka Ezopa',p:["Przez całe lato mała mrówka ciężko pracowała i nosiła do mrowiska ziarenka.","Konik polny grał na skrzypcach i śpiewał w słońcu. „Po co tak harujesz? Chodź się pobawić!”","„Zbieram jedzenie na zimę” – odpowiedziała mrówka. – „Ty też powinieneś!”. Ale konik dalej śpiewał.","Potem przyszła zima. Śnieg przykrył ziemię i nie było nic do jedzenia.","Głodny konik zapukał do drzwi mrówki. Dobra mrówka podzieliła się jedzeniem, a konik powiedział: „Następnego lata też przygotuję się na zimę”.","Morał: dobrze jest się bawić, ale dobrze też pomyśleć o tym, co będzie później."]},
 {e:'🐦‍⬛',t:'Wrona i dzban',src:'bajka Ezopa',p:["W gorący, suchy dzień spragniona wrona znalazła wysoki dzban z odrobiną wody na dnie.","Wsadziła dziób do środka, ale nie mogła dosięgnąć wody. Dziób był za krótki!","Wrona wpadła na pomysł. Podniosła kamyczek i wrzuciła go do dzbana. Plum!","Potem drugi kamyczek. Plum! I następny. Plum, plum, plum!","Z każdym kamyczkiem woda podnosiła się wyżej i wyżej, aż doszła do samej góry.","Sprytna wrona piła i piła. „Ach, pyszna woda!”","Morał: kiedy coś jest trudne, pomyśl i spróbuj nowego, sprytnego sposobu! Naukowcy też tak robią."]},
 {e:'🐭',t:'Mysz miejska i mysz polna',src:'bajka Ezopa',p:["Mysz polna mieszkała w przytulnej norce na polu. Pewnego dnia odwiedziła ją kuzynka z miasta.","Mysz polna podała jęczmień, korzonki i nasionka. „Jakie to zwyczajne!” – powiedziała mysz miejska. – „Chodź ze mną do miasta, pokażę ci prawdziwe jedzenie!”","W wielkim miejskim domu były ciastka, ser i galaretka! Myszy zaczęły jeść.","Nagle drzwi się otworzyły z hukiem! Weszli ludzie, a za nimi przybiegł wielki kot. Myszy schowały się, trzęsąc się ze strachu.","„Do widzenia, kuzynko” – powiedziała mysz polna. – „Wolę jeść zwykłe nasionka w spokoju niż ciastka w strachu!”","Morał: spokojny, szczęśliwy dom jest wart więcej niż wymyślne rzeczy."]},
 {e:'🐔',t:'Mała czerwona kurka',src:'baśń ludowa',p:["Mała czerwona kurka znalazła kilka ziarenek pszenicy. „Kto mi pomoże zasiać pszenicę?” – zapytała.","„Nie ja” – powiedział pies. „Nie ja” – powiedział kot. „Nie ja” – powiedziała kaczka. „To zrobię to sama” – odpowiedziała kurka. I zrobiła.","Pszenica urosła wysoka i złota. „Kto mi pomoże ją ściąć i zanieść do młyna na mąkę?” „Nie ja, nie ja, nie ja!”","Więc kurka zrobiła wszystko sama. „Kto mi pomoże upiec chleb?” „Nie ja, nie ja, nie ja!”. Więc upiekła go sama.","Mmm! Ciepły chleb pachniał cudownie. „Kto mi pomoże zjeść chleb?” „Ja!” – zawołali pies, kot i kaczka.","„Nie pomogliście mi siać, ścinać ani piec” – powiedziała kurka. – „Następnym razem pracujmy razem, a wtedy wszyscy się podzielimy!”","Morał: kiedy pracujemy razem, wszyscy mogą dzielić się dobrymi rzeczami."]},
 {e:'🐷',t:'Trzy małe świnki',src:'baśń ludowa',p:["Trzy małe świnki wyruszyły, żeby zbudować sobie domki.","Pierwsza świnka zbudowała domek ze słomy, bardzo szybko. Druga zbudowała domek z patyków, dość szybko.","Trzecia świnka zbudowała domek z cegieł. Trwało to długo i było ciężką pracą.","Przyszedł wielki, zły wilk. „Świnko, wpuść mnie!”. Dmuchnął i chuchnął, i zdmuchnął słomiany domek! Świnka uciekła do domku brata.","Wilk dmuchnął i chuchnął, i zdmuchnął też domek z patyków! Obie świnki uciekły do domku z cegieł.","Wilk dmuchał i chuchał, i chuchał, i dmuchał, ale domek z cegieł stał mocno! Zmęczony wilk się poddał i uciekł.","Morał: warto zrobić coś starannie, nawet jeśli to ciężka praca. A trzy świnki żyły razem szczęśliwie!"]},
 {e:'🐻',t:'Złotowłosa i trzy misie',src:'baśń ludowa',p:["Dawno temu w domku w lesie mieszkały trzy misie: Tata Miś, Mama Misia i Mały Miś.","Pewnego ranka ich owsianka była za gorąca, więc poszły na spacer, żeby przestygła.","Dziewczynka o imieniu Złotowłosa znalazła domek i po prostu weszła do środka. Spróbowała owsianki. Owsianka Taty Misia była za gorąca. Mamy Misi za zimna. A Małego Misia w sam raz, i zjadła ją całą!","Usiadła na krzesłach. Za twarde, za miękkie i w sam raz. Ale krzesełko Małego Misia się złamało! Trach!","Wypróbowała łóżka. Za twarde, za miękkie i w sam raz. I Złotowłosa smacznie zasnęła w łóżku Małego Misia.","Misie wróciły do domu. „Ktoś jadł moją owsiankę i zjadł ją całą!” – zawołał Mały Miś. Potem znalazły śpiącą Złotowłosą!","Złotowłosa się obudziła, wyskoczyła przez okno i pobiegła do domu. Nauczyła się, że nie wolno wchodzić do czyjegoś domu bez pytania!"]});

   {q:"Dziewczynka spadła z roweru i boli ją ręka. Jak zobaczymy jej kości?",a:[g('🩻',"Robimy zdjęcie rentgenowskie","Promienie rentgenowskie widzą przez skórę i pokazują kości, tak jak przycisk do zaglądania do środka! Złamaną kość trzyma gips, aż się zrośnie."),b('🔦',"Świecimy latarką na rękę","Latarka nie prześwietli skóry. Potrzebne jest specjalne zdjęcie, rentgen.")]},
   {q:"Czas sprawdzić serce pacjenta. Jakiego narzędzia używamy?",a:[g('🩺',"Stetoskopu","Stetoskop sprawia, że puk-puk serca słychać wyraźnie."),b('🔨',"Młotka","Ha, ha, nie! Młotek jest do gwoździ. Lekarze słuchają serca stetoskopem.")]},
   {q:"Zanim lekarz spotka nowego pacjenta, co musi zrobić?",a:[g('🧼',"Umyć ręce mydłem","Mycie rąk usuwa zarazki, żeby nie przechodziły z jednej osoby na drugą."),b('🍪',"Zjeść ciasteczko","Pyszne, ale nie teraz! Najpierw czyste ręce, żeby zarazki się nie roznosiły.")]}]},
 {id:'lawyer',e:'⚖️',n:'Prawnik',place:'w sądzie',bg:'#F3EAD9',deco:['📜','🏛️','🔍','📚','✒️'],
  d:"Prawnicy znają zasady, które nazywamy prawem. Pomagają ludziom, kiedy się nie zgadzają, i pilnują, żeby wszystkich traktowano sprawiedliwie. W sądzie sędzia słucha obu stron.",
  sc:[{q:"Dwoje sąsiadów mówi, że jabłoń należy do nich. Co prawnik robi najpierw?",a:[g('🔍',"Szuka dowodów, jak stare papiery i mapy","Prawnicy szukają dowodów. Dowody to wskazówki, które pokazują prawdę, na przykład mapa, na której widać, gdzie kończy się każdy ogród."),b('😠',"Krzyczy, aż przestaną się kłócić","Krzyk nikomu nie pomaga. Prawnicy są spokojni i szukają faktów.")]},
   {q:"W sądzie mówi teraz drugi prawnik. Co robimy?",a:[g('🤫',"Słuchamy cicho i robimy notatki","W sądzie wszyscy mówią po kolei. Uważne słuchanie pomaga zrozumieć drugą stronę, i to jest sprawiedliwe."),b('🗯️',"Przerywamy mu","Przerywanie nie jest fair. Każdy ma swoją kolej.")]},
   {q:"Pani kupiła toster, który zepsuł się pierwszego dnia, a sklep nie chce pomóc. Co powie prawnik?",a:[g('📜',"Jest zasada: sklep musi naprawić albo wymienić zepsutą rzecz","Istnieje prawo, które chroni kupujących. Znajomość zasad pomaga ludziom upomnieć się o swoje."),b('🤷',"Trudno, trzeba kupić nowy","To nie pomaga. Prawnicy znają zasady, które chronią ludzi. Sklep powinien naprawić albo wymienić toster.")]},
   {q:"Klient zdradza ci tajemnicę dotyczącą sprawy. Co robisz?",a:[g('🔐',"Zachowuję ją dla siebie","Prawnik musi dochować tajemnicy klienta. To bardzo ważna zasada i dzięki niej ludzie mu ufają."),b('📣',"Mówię wszystkim","O nie! Prawnik musi zachować tajemnicę. To jedna z jego najważniejszych zasad.")]}]},
 {id:'teacher',e:'🍎',n:'Nauczyciel',place:'w szkole',bg:'#E8F7E0',deco:['📚','✏️','🔤','🎨','🔢'],
  d:"Nauczyciele pomagają dzieciom uczyć się nowych rzeczy: czytania, liczenia, przyrody i wielu innych. Dobry nauczyciel jest miły i cierpliwy, i sprawia, że nauka to zabawa!",
  sc:[{q:"Dziecku trudno idzie czytanie i jest mu smutno. Co robi nauczyciel?",a:[g('🤗',"Spokojnie pomaga i ćwiczy razem z nim","Każdy uczy się w swoim tempie. Wspólne ćwiczenie, krok po kroku, dodaje odwagi."),b('⏩',"Szybko przechodzi do następnej rzeczy","Jeśli się spieszymy, dziecko może zostać w tyle. Dobry nauczyciel znajduje czas, żeby pomóc.")]},
   {q:"Jak nauczyć klasę o roślinach?",a:[g('🌱',"Posadzić fasolki w doniczkach i je obserwować","Najlepiej uczyć się przez działanie! Dzieci codziennie widzą, jak rosną korzenie i liście."),b('😴',"Mówić o roślinach przez całą godzinę","Mówienie przez godzinę robi się nudne. Działanie sprawia, że wiedza zostaje w głowie!")]},
   {q:"Dwoje dzieci chce tę samą czerwoną kredkę. Co powie nauczyciel?",a:[g('⏱️',"Używajcie jej po kolei albo znajdźmy drugą czerwoną","Dzielenie się i czekanie na swoją kolej to ważne rzeczy, których uczymy się w szkole, tak jak czytania."),b('🗑️',"Wyrzucić kredkę","Wtedy nikt jej nie użyje! Lepiej się dzielić.")]},
   {q:"Klasa świetnie posprzątała! Co robi nauczyciel?",a:[g('⭐',"Mówi: brawo, dziękuję","Kiedy ktoś zauważa dobrą pracę, dzieci są dumne i chcą się dalej starać."),b('🙈',"Nic nie mówi","Małe dziękuję wiele znaczy! Pomaga poczuć dumę.")]}]},
 {id:'firefighter',e:'🚒',n:'Strażak',place:'w remizie strażackiej',bg:'#FFE3DC',deco:['🔥','🧯','🪜','💧','🚨'],
  d:"Strażacy gaszą pożary i ratują ludzi i zwierzęta. Uczą też wszystkich, jak być bezpiecznym. Wóz strażacki ma długą drabinę i węże pełne wody.",
  sc:[{q:"Dzwoni alarm! Jest pożar. Co robią strażacy?",a:[g('🧥',"Zakładają specjalne ubrania i wskakują do wozu","Specjalne kombinezony i hełmy chronią przed gorącem i dymem. Strażacy ubierają się w około minutę!"),b('🍵',"Najpierw kończą herbatę","Nie ma czasu na herbatę! Kiedy dzwoni alarm, strażacy się spieszą, bo liczy się każda sekunda.")]},
   {q:"Kotek utknął na wysokim drzewie. Jak pomożemy?",a:[g('🪜',"Użyjemy długiej drabiny","Drabina sięga wysoko, a strażak może delikatnie znieść kotka na dół."),b('🦘',"Podskoczymy bardzo wysoko","Nikt nie skoczy tak wysoko! Długa drabina to bezpieczny sposób.")]},
   {q:"Pali się garnek z gorącym olejem. Czy lejemy na niego wodę?",a:[b('💧',"Tak, dużo wody","Woda na płonący olej sprawia, że olej pryska i ogień się rozprzestrzenia. To niebezpieczne!"),g('🧯',"Nie, przykrywamy go kocem gaśniczym","Sprytnie! Przykrycie zabiera ogniu powietrze i ogień gaśnie. Nigdy nie lej wody na płonący olej.")]},
   {q:"Strażacy odwiedzają szkołę. Czego uczą?",a:[g('🚶',"Wyjdź, nie wracaj i dzwoń pod 112","Wyjdź na zewnątrz, nie wracaj do środka i wezwij pomoc pod numerem 112. Nigdy nie wracaj po zabawki."),b('🧸',"Wróć po zabawki","Nigdy nie wracaj do ognia, nawet po ulubioną zabawkę. Najważniejsi są ludzie!")]}]},
 {id:'vet',e:'🐶',n:'Weterynarz',place:'w lecznicy dla zwierząt',bg:'#FFF1DA',deco:['🐱','🐰','🦴','🩹','🐾'],
  d:"Weterynarze to lekarze zwierząt! Opiekują się zwierzętami domowymi, zwierzętami z farmy, a nawet z zoo. Zwierzęta nie powiedzą, gdzie je boli, więc weterynarz musi być świetnym detektywem.",
  sc:[{q:"Szczeniaczek nie chce jeść i jest smutny. Co robimy?",a:[g('🔍',"Sprawdzamy brzuszek, zęby i temperaturę","Zwierzęta nie mówią, więc weterynarz szuka wskazówek na całym ciele."),b('🍫',"Dajemy mu czekoladę","O nie! Czekolada jest dla psów trująca. Nigdy nie dawaj psom czekolady!")]},
   {q:"Kotek potrzebuje szczepionki. Po co?",a:[g('💉',"Żeby nie zachorował","Szczepionka uczy ciało walczyć z zarazkami, zanim przyjdą, jak ćwiczenia przed prawdziwym alarmem."),b('🎨',"Żeby zmienić mu kolor","Ha, ha, nie! Szczepionki chronią zwierzęta przed chorobami.")]},
   {q:"Króliczek ma za długie zęby. Co się stało?",a:[g('🌾',"Za mało gryzł siana","Zęby królika rosną przez całe życie. Żucie siana przez cały dzień je ściera. Pamiętasz naszego króliczka?"),b('🪥',"Za często mył zęby","Króliki nie myją zębów! Potrzebują dużo siana do gryzienia.")]},
   {q:"Dzwoni rolnik: krowa rodzi cielaczka! Co robimy?",a:[g('🚗',"Jedziemy na farmę pomóc","Weterynarze jeżdżą do zwierząt na farmę, bo krowa jest za duża, żeby przywieźć ją do lecznicy!"),b('📦',"Prosimy rolnika, żeby przysłał krowę pocztą","Ha, ha! Krowa nie zmieści się w paczce. Weterynarz jedzie na farmę.")]}]},
 {id:'chef',e:'👩‍🍳',n:'Kucharz',place:'w kuchni restauracji',bg:'#FFF4E0',deco:['🍲','🥕','🧁','🍳','🧄'],
  d:"Kucharze gotują pyszne jedzenie w restauracjach. Wybierają składniki, łączą smaki i pięknie układają jedzenie na talerzu. W kuchni jest gwarno, więc kucharze pracują w zespole.",
  sc:[{q:"Co kucharz robi najpierw, zanim zacznie gotować?",a:[g('🧼',"Myje ręce i związuje włosy","Czyste ręce i związane włosy sprawiają, że do jedzenia nie trafią zarazki ani włosy."),b('🎤',"Śpiewa piosenkę","Śpiewanie jest fajne, ale najpierw czyste ręce!")]},
   {q:"Klient ma uczulenie na orzechy. Co robi kucharz?",a:[g('🚫',"Gotuje bez żadnych orzechów, czystymi narzędziami","Uczulenie oznacza, że nawet okruszek może komuś bardzo zaszkodzić. Kucharz jest wtedy wyjątkowo ostrożny."),b('🤏',"Dodaje tylko kilka orzechów","Nawet kilka to za dużo! Przy uczuleniu nawet okruszek może być groźny.")]},
   {q:"Zupa jest bez smaku. Co dodamy?",a:[g('🌿',"Zioła i szczyptę soli","Zioła i odrobina soli wydobywają smak. Próbowanie podczas gotowania to sekret kucharzy."),b('🍬',"Torebkę cukierków","Fuj! Cukierki nie pasują do zupy. Zioła i sól są lepsze.")]},
   {q:"Co trzeba schować do lodówki?",a:[g('🥛',"Mleko i rybę","Zimno spowalnia zarazki, więc mleko i ryba zostają świeże i bezpieczne."),b('🍌',"Banany","Banany w lodówce brązowieją! Najbardziej zimna potrzebują mleko i ryba.")]}]},
 {id:'scientist',e:'🔬',n:'Naukowiec',place:'w laboratorium',bg:'#E8F0FF',deco:['🧪','🧬','⚗️','💡','🦠'],
  d:"Naukowcy zadają pytania o świat i robią doświadczenia, żeby znaleźć odpowiedzi. Badają wszystko: gwiazdy, zwierzęta, lekarstwa, a nawet malutkie zarazki!",
  sc:[{q:"Czy rośliny potrzebują światła, żeby rosnąć? Jak to sprawdzić?",a:[g('🌱',"Postawić jedną roślinkę w świetle, a drugą w ciemności","To się nazywa uczciwy test! Zmieniamy tylko jedną rzecz i patrzymy, co się stanie."),b('🤔',"Po prostu zgadnąć","Zgadywanie to dobry początek, nazywa się hipoteza. Ale naukowcy sprawdzają swoje pomysły doświadczeniami!")]},
   {q:"Chcemy zobaczyć malutkie zarazki. Jakiego narzędzia używamy?",a:[g('🔬',"Mikroskopu","Mikroskop sprawia, że malutkie rzeczy wyglądają na ogromne, więc widać zarazki i komórki."),b('🔭',"Teleskopu","Teleskop jest do dalekich rzeczy, jak gwiazdy. Do malutkich używamy mikroskopu.")]},
   {q:"Doświadczenie nie wyszło tak, jak myśleliśmy. Co teraz?",a:[g('📝',"Zapisać wynik i sprawdzić, dlaczego tak wyszło","Pomyłki uczą naukowców nowych rzeczy. Wiele odkryć zdarzyło się przez przypadek!"),b('🙈',"Ukryć wyniki","Naukowcy nigdy nie ukrywają wyników. Każdy wynik czegoś uczy.")]},
   {q:"Mieszamy substancje chemiczne. Co zakładamy?",a:[g('🥽',"Gogle i rękawiczki","Gogle chronią oczy, a rękawiczki dłonie. W laboratorium najważniejsze jest bezpieczeństwo!"),b('🩴',"Klapki","O nie! W laboratorium potrzebne są gogle, rękawiczki i fartuch.")]}]},
 {id:'pilot',e:'✈️',n:'Pilot',place:'na lotnisku',bg:'#DDF1FF',deco:['☁️','🛫','🧳','🗺️','☀️'],
  d:"Piloci latają samolotami i zabierają ludzi w różne miejsca na świecie. Sprawdzają pogodę, rozmawiają przez radio z wieżą kontroli lotów i dbają o bezpieczeństwo pasażerów.",
  sc:[{q:"Co robi pilot przed startem?",a:[g('📋',"Sprawdza wszystko z listy kontrolnej","Piloci sprawdzają paliwo, skrzydła, silniki i światła, z listą, żeby niczego nie zapomnieć."),b('💤',"Ucina sobie drzemkę","Żadnych drzemek przed lotem! Lista kontrolna dba o bezpieczeństwo.")]},
   {q:"Wieża mówi: proszę czekać, ląduje inny samolot. Co robimy?",a:[g('⏸️',"Czekamy na swoją kolej","Wieża kontroli lotów jest jak sygnalizacja świetlna dla samolotów. Czekanie jest bezpieczne."),b('🏎️',"Startujemy mimo to","Nigdy! Słuchanie wieży sprawia, że samoloty na siebie nie wpadają.")]},
   {q:"Przed nami wielka burza z piorunami. Co robimy?",a:[g('↪️',"Omijamy ją","Burze trzęsą samolotem i mają pioruny, więc piloci je omijają."),b('⚡',"Lecimy prosto przez nią","Za bardzo trzęsie i jest niebezpiecznie! Piloci omijają burze.")]},
   {q:"Dlaczego duże samoloty latają wysoko nad chmurami?",a:[g('🌤️',"Bo tam powietrze jest spokojniejsze","Wysoko powietrze jest rzadkie i spokojne, więc lot jest gładszy i zużywa mniej paliwa."),b('🐦',"Żeby oglądać ptaki","Ptaki latają dużo niżej! Samoloty latają wysoko, bo tam jest spokojniej i oszczędza się paliwo.")]}]},
 {id:'farmer',e:'🚜',n:'Rolnik',place:'na farmie',bg:'#EEF8D8',deco:['🌾','🐄','🐔','🥕','🌻'],
  d:"Rolnicy uprawiają jedzenie, które jemy: pszenicę na chleb, warzywa i owoce. Opiekują się też zwierzętami, jak krowy i kury. Bez rolników nie byłoby śniadania!",
  sc:[{q:"Nasionka są zasiane. Czego potrzebują, żeby rosnąć?",a:[g('💧',"Wody, słońca i dobrej ziemi","Rośliny piją wodę korzeniami, a jedzenie robią sobie ze światła słonecznego."),b('🎵',"Głośnej muzyki","Rośliny potrzebują wody, słońca i ziemi. Muzyka niewiele pomoże!")]},
   {q:"Kury zniosły rano jajka. Kiedy je zbieramy?",a:[g('🧺',"Codziennie, delikatnie","Kury znoszą jajka prawie codziennie, więc rolnik zbiera je codziennie, żeby były świeże."),b('🗓️',"Raz w roku","O wiele za długo! Jajka by się zepsuły. Zbieramy je codziennie.")]},
   {q:"Malutkie robaczki zjadają kapustę! Co robimy?",a:[g('🐞',"Zapraszamy biedronki, żeby zjadły robaczki","Biedronki zjadają malutkie mszyce. Pomocne zwierzęta są dobre dla przyrody."),b('🙀',"Pozwalamy robaczkom zjeść wszystko","Wtedy nie będzie kapusty! Biedronki to naturalni pomocnicy.")]},
   {q:"Jest bardzo gorąco i krowy są spragnione. Co robimy?",a:[g('🚰',"Dajemy im świeżą wodę i cień","W upalny dzień krowa może wypić ponad pięćdziesiąt litrów wody. To mnóstwo butelek!"),b('🧥',"Zakładamy im swetry","W swetrach byłoby im jeszcze goręcej! Woda i cień pomagają się ochłodzić.")]}]}
];

 {id:'therapy',e:'💕',n:'Królik terapeuta',place:'w szpitalu',bg:'#FFE8F1',deco:['💗','🏥','🧸','🌷','✨'],

   {q:"Na korytarzu coś głośno huknęło. Jak czuje się króliczek?",a:[g('🙉',"Boi się, bo króliczki świetnie słyszą","Pamiętasz te duże uszy? Króliczki bardzo dobrze słyszą, więc głośne dźwięki je straszą. Cichy pokój pomaga."),b('🥳',"Cieszy się, bo uwielbia hałas","Nie bardzo! Czułe uszy sprawiają, że hałas jest dla króliczków straszny.")]},

 {id:'meadow',e:'🌼',n:'Strażnik łąki',place:'na łące',bg:'#ECF9DC',deco:['🌼','🌾','🦋','🐝','☀️'],
  d:"Dzikie króliki to kosiarki przyrody! Skubią trawę i utrzymują ją krótką, więc malutkie dzikie kwiatki dostają słońce i mogą rosnąć.",
  sc:[{q:"Trawa jest wysoka, a małe kwiatki są w cieniu. Co robimy?",a:[g('🌾',"Skubiemy wysoką trawę","Kiedy króliki skubią trawę, kwiatki dostają słońce. Wtedy przylatują pszczoły i motyle!"),b('😴',"Idziemy spać","Wtedy trawa zasłoni kwiatki. Skubanie to praca króliczka!")]},
   {q:"Idzie lis! Co robimy?",a:[g('🦶',"Tupiemy tylną łapką, żeby ostrzec innych, i się chowamy","Króliki tupią w ziemię, żeby ostrzec rodzinę. To jak alarm!"),b('👋',"Mówimy lisowi: dzień dobry","O nie, lisy polują na króliki! Tupnij, żeby ostrzec innych, i szybko się schowaj.")]},
   {q:"Jakie jedzenie jest najlepsze dla króliczka?",a:[g('🌿',"Trawa i zielone rośliny","Króliki jedzą głównie trawę i zielone rośliny. Marchewka to tylko mały przysmak."),b('🍭',"Lizaki","Cukier szkodzi króliczkom! Trawa i liście to ich zdrowe jedzenie.")]},
   {q:"Kiedy dzikie króliki pracują najwięcej?",a:[g('🌅',"O świcie i o zmierzchu","Króliki są najbardziej zajęte wcześnie rano i wieczorem, kiedy drapieżnikom trudniej je zobaczyć."),b('🥵',"W samo gorące południe","Króliki wolą świt i zmierzch, kiedy jest chłodniej i bezpieczniej.")]}]},
 {id:'warren',e:'🕳️',n:'Budowniczy nor',place:'w norze',bg:'#F3E6D6',deco:['🪱','🌱','🍂','🪨','🌿'],

JOBS.dog=[

 {id:'rescue',e:'⛑️',n:'Pies ratownik',place:'w górach',bg:'#E8F4FF',deco:['🏔️','❄️','🚁','🧱','⛑️'],
